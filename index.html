<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>먼작귀 힐링 월드</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#4d3f55;--rose:#f58aa8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#7cc78c;color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:background 1.5s}
body.n{background:#24483c}
#app{display:flex;flex-direction:column;min-height:100dvh}
#scene{position:relative;flex:1;min-height:470px;overflow:hidden;background:linear-gradient(#8fd0ff,#cfeeff 55%,#fff1dd)}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(60,40,90,.2));pointer-events:none;z-index:5}
#dusk,#night{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
#dusk{background:linear-gradient(#ffa77c,#ffd3b0 60%,#ffe8cf)}
#night{background:linear-gradient(#10132f,#2a2860 62%,#4a4478)}
#scene.dusk #dusk,#scene.night #night{opacity:1}
#orb{position:absolute;right:9%;top:120px;width:62px;height:62px;border-radius:50%;background:#ffe27a;box-shadow:0 0 40px 8px rgba(255,231,154,.8);transition:all 1.5s}
.night #orb{background:#fffbe0;box-shadow:inset -14px -6px 0 0 #d4d8ff,0 0 34px 6px rgba(255,248,192,.6)}
#stars{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
.night #stars{opacity:1}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
.cl{position:absolute;left:-220px;top:150px;width:120px;height:34px;border-radius:40px;background:rgba(255,255,255,.92);animation:drift 80s linear infinite;transition:opacity 1.5s}
.cl::before,.cl::after{content:'';position:absolute;background:inherit;border-radius:50%}
.cl::before{width:52px;height:52px;left:16px;top:-26px}.cl::after{width:40px;height:40px;left:64px;top:-17px}
.c2{top:235px;scale:.7;animation-duration:110s;animation-delay:-45s}
.c3{top:105px;scale:.55;animation-duration:95s;animation-delay:-70s}
.night .cl{opacity:.1}
@keyframes drift{to{transform:translateX(calc(100vw + 460px))}}
.hills{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:2;transition:filter 1.5s}
.hills i{position:absolute;border-radius:50%}
.h1{left:-20%;width:80%;height:100%;bottom:-32%;background:linear-gradient(#cdb9f2,#b3d9c3)}
.h2{right:-25%;width:92%;height:88%;bottom:-40%;background:linear-gradient(#b8e7b1,#93d49b)}
.h3{left:-12%;right:-12%;height:72%;bottom:-42%;background:linear-gradient(#a8e19c,#7cc78c)}
.night .hills{filter:brightness(.4) saturate(.8)}
.dusk .hills{filter:brightness(.88) sepia(.3)}
header{position:absolute;top:0;left:0;right:0;z-index:7;padding:16px 14px 0;text-align:center}
h1{margin:0 0 10px;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(28px,6.5vw,42px);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 #f58aa8,0 3px 0 #e9739a,0 8px 18px rgba(120,60,110,.45)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(80,60,100,.12)}
.chip[aria-pressed=true]{background:linear-gradient(135deg,#ff9db9,#f58aa8);color:#fff;border-color:transparent}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none}
#row{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,3vw,40px);z-index:3}
.ch{position:relative;isolation:isolate;width:clamp(100px,28vw,172px);background:none;border:0;padding:0 0 4px;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ch::before{content:'';position:absolute;z-index:-1;left:10%;right:10%;bottom:24px;height:14px;border-radius:50%;background:rgba(30,60,40,.3);filter:blur(5px)}
.ch::after{content:'';position:absolute;z-index:-1;left:-8%;right:-8%;top:-4%;bottom:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.7),transparent);opacity:0;transition:opacity .3s}
.ch.sel::after{opacity:1}
.face{display:block;animation:bob 3.2s ease-in-out infinite}
.ch:nth-child(2) .face{animation-delay:-1.1s}.ch:nth-child(3) .face{animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
.ch.hop .face{animation:hop .45s}
@keyframes hop{40%{transform:translateY(-24px) rotate(-3deg) scale(1.05)}}
.pic{position:relative;display:block}
.pic img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 6px 5px rgba(60,40,70,.2));transform-origin:50% 92%}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.st-eat img{animation:chew .34s 4}.st-sleep img{animation:breathe 2.6s ease-in-out infinite}
@keyframes chew{50%{transform:scale(1.06,.93)}}
@keyframes breathe{50%{transform:scale(1.02,.97)}}
.nm{display:block;margin:2px auto 0;width:max-content;font-family:'Jua',sans-serif;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(60,40,70,.5);border-radius:999px;padding:2px 13px}
.ch.sel .nm{background:linear-gradient(135deg,#ff9db9,#f58aa8);box-shadow:0 3px 10px rgba(245,138,168,.55);text-shadow:none}
.bub{position:absolute;bottom:94%;left:50%;width:max-content;max-width:min(200px,44vw);padding:9px 14px;border-radius:18px;background:#fff;font-size:14px;line-height:1.4;box-shadow:0 8px 22px rgba(80,50,90,.2);opacity:0;transform:translate(-50%,6px) scale(.85);transition:.2s;pointer-events:none;z-index:6}
.bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.bub.on{opacity:1;transform:translate(-50%,0) scale(1)}
.zz{position:absolute;top:2%;right:8%;font-size:26px;animation:bob 1.6s infinite}
.fl{position:absolute;bottom:60%;font-size:22px;pointer-events:none;animation:rise 1.2s forwards;z-index:7}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
#panel{position:relative;z-index:6;margin:-30px auto 14px;width:min(560px,calc(100% - 24px));padding:14px 16px 16px;border-radius:28px;background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.95);box-shadow:0 14px 40px rgba(70,50,100,.25)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lvb{flex:none;position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff9db9,#b79bff,#7ec8ff,#ff9db9);box-shadow:0 4px 12px rgba(150,110,200,.4)}
.lvb::before{content:'';position:absolute;inset:4px;border-radius:50%;background:linear-gradient(135deg,#f58aa8,#a98bf0)}
.lvb span{position:relative;font-family:'Jua',sans-serif;font-size:15px;color:#fff}
.top b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:21px}
.top small{color:#8f7f99;font-size:13px}
.st{display:grid;grid-template-columns:66px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.tr{height:11px;border-radius:9px;background:rgba(120,90,140,.13);overflow:hidden;box-shadow:inset 0 1px 2px rgba(80,50,100,.15)}
.tr i{display:block;height:100%;border-radius:9px;transition:width .5s;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.a{border:0;border-radius:18px;padding:9px 2px 8px;background:linear-gradient(#fff,#fff1f6);box-shadow:0 3px 0 #ecd0dc,0 6px 12px rgba(150,100,140,.12);font:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:transform .15s}
.a b{display:block;font-size:25px;font-weight:400;line-height:1.2}
.a:hover{transform:translateY(-2px)}.a:active{transform:translateY(2px);box-shadow:0 1px 0 #ecd0dc}
:focus-visible{outline:3px solid #6a8cff;outline-offset:2px}
@media(max-width:520px){.acts{grid-template-columns:repeat(3,1fr)}#scene{min-height:450px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.coin{margin-left:auto;font-family:'Jua',sans-serif;font-size:17px;background:linear-gradient(135deg,#fff3c4,#ffd86b);border-radius:999px;padding:5px 13px;box-shadow:0 2px 0 #e0b030;white-space:nowrap}
.acts.q{grid-template-columns:repeat(3,1fr);margin-top:8px}
.acts.q .a{background:linear-gradient(#fff,#eef6ff);box-shadow:0 3px 0 #c9dcf0,0 6px 12px rgba(100,130,160,.12)}
.pic svg{overflow:visible}.pic svg.bk{z-index:-1}
#qm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:12px;background:rgba(60,40,80,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#qm[hidden]{display:none}
.qb{width:min(480px,100%);max-height:92dvh;overflow:auto;background:rgba(255,255,255,.94);border-radius:26px;padding:16px;box-shadow:0 20px 60px rgba(40,20,70,.4)}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qh b{flex:1;font-family:'Jua',sans-serif;font-weight:400;font-size:20px}
#qs{font-family:'Jua',sans-serif;font-size:15px}
#qx{border:0;background:#f3e6ec;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;color:var(--ink)}
.board{display:grid;gap:8px;grid-template-columns:repeat(var(--cols),1fr);touch-action:manipulation}
.cell{aspect-ratio:1;border:0;border-radius:18px;font-size:clamp(26px,9vw,38px);line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:transform .1s;-webkit-user-select:none;user-select:none}
.cell:active{transform:scale(.92)}
.cell small{display:block;font-size:11px;color:#c23a52;min-height:12px}
.board.weed .cell{background:radial-gradient(#b9ea9e,#8cd08a)}
.board.hunt .cell{background:radial-gradient(#9a7658,#6b4f3a)}
.res{text-align:center;margin-top:12px}
.res p{margin:6px 0 12px;line-height:1.5}
.res .chip{background:linear-gradient(135deg,#ff9db9,#f58aa8);color:#fff;border-color:transparent;font-size:16px;padding:8px 26px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.pv{width:130px;margin:0 auto 8px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.co{border:2px solid transparent;border-radius:16px;background:linear-gradient(#fff,#fff1f6);box-shadow:0 3px 0 #ecd0dc;padding:8px 2px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.co b{display:block;font-size:26px;font-weight:400}
.co small{display:block;color:#9a8aa3;margin-top:2px}
.co.on{border-color:#f58aa8;background:linear-gradient(#fff,#ffe3ec)}
.co.on small{color:#e0527c}
</style>
</head>
<body>
<div id="app">
<div id="scene">
  <div id="dusk"></div><div id="night"></div><div id="stars"></div><div id="orb"></div><i class="cl"></i><i class="cl c2"></i><i class="cl c3"></i>
  <header><h1>먼작귀 힐링 월드</h1><div class="ctl" id="ctl"></div></header>
  <div class="hills"><i class="h1"></i><i class="h2"></i><i class="h3"></i></div>
  <div id="row"></div>
  <canvas id="fx"></canvas>
</div>
<section id="panel">
  <div class="top"><div class="lvb"><span id="lvn">Lv.1</span></div><div><b id="nm"></b><small id="hint"></small></div><div class="coin" id="coin">🪙 0</div></div>
  <div class="st"><span>🍙 배부름</span><div class="tr"><i id="bh" style="background:linear-gradient(90deg,#ffd08a,#ff9f5a)"></i></div><span id="vh"></span></div>
  <div class="st"><span>💗 기분</span><div class="tr"><i id="bm" style="background:linear-gradient(90deg,#ffb3c8,#ff7fa6)"></i></div><span id="vm"></span></div>
  <div class="st"><span>⚡ 에너지</span><div class="tr"><i id="be" style="background:linear-gradient(90deg,#a6dcff,#5eb4f5)"></i></div><span id="ve"></span></div>
  <div class="st"><span>✨ 친밀도</span><div class="tr"><i id="bb" style="background:linear-gradient(90deg,#cdb9ff,#9a78f0)"></i></div><span id="vb"></span></div>
  <div class="acts" id="acts"></div>
  <div class="acts q" id="qacts"><button class="a" data-q="weed"><b>🌿</b>풀뽑기</button><button class="a" data-q="hunt"><b>⚔️</b>토벌</button><button class="a" data-q="shop"><b>👗</b>코스튬</button></div>
</section>
</div>
<div id="qm" hidden><div class="qb" role="dialog" aria-modal="true"><div class="qh"><b id="qt"></b><span id="qs"></span><button id="qx" aria-label="닫기">✕</button></div><div id="qg"></div><div id="qr"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const D=[
{id:'chii',n:'치이카와',e:'round',body:'#fffaf7',acc:'#ffc9d6',fs:'🍓',pe:6,
 L:['으아… 나 여기 있어도 돼?','오늘도 열심히 해볼게!','따뜻해서 좋다아…','두근두근… 가까이 가도 돼?','같이 있으면 안심돼'],
 N:'별이 예쁘다… 조금 졸려',W:{rain:'비다… 우산 같이 쓸래?',snow:'눈이다! 손이 차가워도 괜찮아',sakura:'꽃잎이 머리에 앉았어!'},
 F:'딸기다! 너무 기뻐서 눈물 날 것 같아…',O:'고마워… 맛있어!',M:'밥이다… 잘 먹겠습니다!',P:'숨바꼭질? 놀라지 않게 살살 해줘…',S:'쿨… 쿨…',A:'으음… 푹 잤어! 고마워',X:'배불러서 더는 못 먹겠어…',T:'너무 피곤해… 조금만 쉬고 싶어',G:'배에서 꼬르륵 소리가 났어…'},
{id:'hachi',n:'하치와레',e:'cat',body:'#f4fbff',acc:'#9fd4ff',fs:'🍪',pe:12,
 L:['좋아~! 해보자!','하나, 둘! 기운이 넘쳐!','야호~! 오늘도 최고야!','같이 달리자!','내가 지켜줄게!'],
 N:'밤인데도 눈이 말똥말똥!',W:{rain:'물웅덩이 첨벙첨벙! 신난다!',snow:'눈싸움하자! 받아라!',sakura:'꽃잎 잡기 시합이야!'},
 F:'쿠키다! 바삭바삭 최고야!',O:'냠냠! 다음엔 쿠키도 줘!',M:'밥 먹고 힘 팍팍 낼게!',P:'와~! 한 번 더, 한 번 더!',S:'드르렁… 더 달릴 수 있는데…',A:'기지개 쭈욱~ 힘이 솟아!',X:'배불러~! 이제 놀자!',T:'헉헉… 잠깐 쉬어도 돼?',G:'배고파서 힘이 안 나~!'},
{id:'usagi',n:'우사기',e:'rabbit',body:'#fff9d8',acc:'#ffe27a',fs:'🍡',pe:8,
 L:['야하!','우라~ 우라~!','후훗, 놀랐지?','간식 줘, 간식!','푸하하! 재밌다!'],
 N:'밤엔 몰래 장난쳐도 되려나?',W:{rain:'우산 없이 빙글빙글~!',snow:'눈사람 만들어서 놀래켜야지!',sakura:'꽃잎 비다! 푸하하!'},
 F:'경단이다! 야하~! 하나 더!',O:'음… 이것도 괜찮네! 그래도 경단이 최고',M:'밥도 먹고 간식도 먹을래!',P:'장난 대성공! 푸하하!',S:'쿠우… (장난치는 꿈 중)',A:'잘 잤다! 이제 장난칠 시간이야!',X:'배불러서 데굴데굴~',T:'장난칠 힘이 없어… 눕고 싶어',G:'배고파서 장난칠 힘도 없어!'}
];
const K='#7a6672',byId={};D.forEach(c=>byId[c.id]=c);
let s={},wx='sakura',tm='auto',cur=D[0].id,tmp={},coins=0,own=[],wear={};
try{const v=JSON.parse(localStorage.getItem('mjw1'));if(v){s=v.s||{};wx=v.wx||wx;coins=v.coins||0;own=v.own||[];wear=v.wear||{}}}catch(e){}
D.forEach(c=>{s[c.id]=Object.assign({h:70,m:70,e:80,b:0,z:false},s[c.id]);s[c.id].z=false});
const save=()=>{try{localStorage.setItem('mjw1',JSON.stringify({s,wx,coins,own,wear}))}catch(e){}};

function act(t){
  const id=cur,c=byId[id],S=s[id];
  if(S.z)return say(id,c.S);
  let dh=0,dm=0,de=0,db=0,txt,st='happy',fx='💖';
  if(t=='sleep'){
    S.z=true;say(id,c.S);R(id);ui();
    setTimeout(()=>{S.z=false;S.e=cl(S.e+40);S.m=cl(S.m+(isNight()?12:6));S.b+=2;R(id);say(id,c.A);fl(id,'✨');ui()},5000);

  }
  if(t=='meal'){if(S.h>=92)return say(id,c.X);dh=30;dm=6;db=4;txt=c.M;st='eat';fx='🍙'}
  else if(t=='play'){if(S.h<20)return say(id,c.G);if(S.e<15)return say(id,c.T);de=-c.pe;dm=16;db=4;txt=c.P;fx='🎈'}
  else{if(S.h>=96)return say(id,c.X);const fav=t==c.fs;dh=8;dm=fav?16:8;db=fav?6:3;txt=fav?c.F:c.O;st='eat';fx=t}

  if(lv(S.b)>L0){txt+=` (Lv.${lv(S.b)} 달성!)`;fx='🎉'}

}

function sky(){const h=new Date().getHours(),n=isNight(),d=tm=='auto'&&((h>=17&&h<19)||(h>=5&&h<7));
  sc.classList.toggle('night',n);document.body.classList.toggle('n',n);sc.classList.toggle('dusk',d&&!n);ctlUI()}
$('stars').innerHTML=Array.from({length:26},()=>`<i style="left:${Math.random()*100}%;top:${Math.random()*45}%;opacity:${.4+Math.random()*.6}"></i>`).join('');

// 날씨 파티클
const cv=$('fx'),g=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=sc.clientWidth;H=cv.height=sc.clientHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<90;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),a:Math.random()*6});
const FF=Array.from({length:16},()=>({x:Math.random(),y:.5+Math.random()*.4,a:Math.random()*6,s:.003+Math.random()*.004}));
function tick(){
  g.clearRect(0,0,W,H);
  if(sc.classList.contains('night'))for(const f of FF){f.a+=f.s*8;const x=(f.x+Math.sin(f.a)*.03)*W,y=(f.y+Math.cos(f.a*1.3)*.03)*H,o=.5+.5*Math.sin(f.a*3),r=g.createRadialGradient(x,y,0,x,y,9);r.addColorStop(0,`rgba(255,248,170,${o})`);r.addColorStop(1,'rgba(255,248,170,0)');g.fillStyle=r;g.beginPath();g.arc(x,y,9,0,7);g.fill()}
  if(wx!='clear')for(const p of P){
    if(wx=='rain'){p.y+=5+p.r*2.5;p.x-=.8;g.strokeStyle='rgba(120,170,230,.75)';g.lineWidth=1.5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+.8,p.y-11);g.stroke()}
    else if(wx=='snow'){p.y+=.32+p.r*.55;p.x+=Math.sin(p.a+=.012)*.3;g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,2+p.r*3,0,7);g.fill()}
    else{p.y+=.4+p.r*.5;p.x+=Math.sin(p.a+=.012)*.6;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle='#ffb7cb';g.beginPath();g.ellipse(0,0,6+p.r*3,3+p.r*2,0,0,7);g.fill();g.restore()}
    if(p.y>H+10||p.x<-20||p.x>W+20){p.y=-10;p.x=Math.random()*W}
  }
  requestAnimationFrame(tick);
}
tick();

// 시간 경과: 배고픔·기분·에너지가 서서히 줄어듦
setInterval(()=>{D.forEach(c=>{const S=s[c.id];S.h=cl(S.h-2);S.m=cl(S.m-(S.h<25?3:1));if(!S.z)S.e=cl(S.e-1)});ui()},6000);
setInterval(sky,30000);

// ── 풀뽑기 · 토벌 · 코스튬
const QL={chii:{win:'해냈어… 나도 도움이 됐을까?',lose:'으으… 무서웠어… 다음엔 꼭 해낼게',wear:'어울려…? 고마워, 소중히 입을게!'},
 hachi:{win:'해냈다~! 우리 최고지!',lose:'분하다! 한 번 더 도전하자!',wear:'어때, 멋지지? 히히!'},
 usagi:{win:'우라~! 완전 쉬웠지!',lose:'이상하네, 오늘은 컨디션이 별로야!',wear:'야하! 완전 멋있잖아!'}};
const KD={w:['🌿',1,2.4],g:['🍀',3,1.6],f:['🌷',-2,2],m:['👾',1,1.7],b:['👹',1,2.6],ok:['✨',0,.3],no:['💦',0,.3]};
const TT={weed:{n:'풀뽑기',cols:4,n2:12,time:25,goal:14,rule:'🌿를 눌러 뽑고, 🍀는 3점! 🌷는 뽑으면 감점이에요. 25초 안에 14점을 모아요.'},
 hunt:{n:'토벌',cols:3,n2:9,time:40,goal:10,rule:'👾를 눌러 물리쳐요. 👹는 여러 번 눌러야 해요. 놓치면 ❤️가 줄어요. 10마리를 처치해요!'}};
let G=null;
const qm=$('qm');
function stopG(){if(G){clearInterval(G.iv);G=null}}
function closeM(){stopG();qm.hidden=true;ui()}
function openM(t){$('qt').textContent=t;qm.hidden=false;$('qr').innerHTML=''}
function startQ(t){
  const c=byId[cur],S=s[cur];
  if(S.z)return say(cur,c.S);
  if(S.e<15)return say(cur,c.T);
  if(S.h<15)return say(cur,c.G);
  const T=TT[t];openM(`${c.n}의 ${T.n}`);$('qs').textContent='';
  $('qg').className='board '+t;$('qg').style.setProperty('--cols',T.cols);
  $('qg').innerHTML=Array.from({length:T.n2},(_,i)=>`<button class="cell" data-i="${i}" aria-label="칸 ${i+1}"></button>`).join('');
  $('qr').innerHTML=`<div class="res"><p>${T.rule}</p><button class="chip" id="qgo">시작!</button></div>`;
  G={t,T,idle:true,cur};
}
function begin(){
  const g=G,T=g.T;g.idle=false;g.left=T.time;g.score=0;g.sp=.3;g.rate=t=>g.t=='weed'?.55:Math.max(.55,.9-(T.time-g.left)*.01);
  g.hearts=g.t=='hunt'?(g.cur=='chii'?4:3):0;g.cells=Array.from({length:T.n2},()=>null);
  $('qr').innerHTML='';g.iv=setInterval(tick2,100);hud();
}
function paint(i){const g=G,c=g.cells[i],b=$('qg').children[i];if(!b)return;
  b.innerHTML=c?(KD[c.k][0]+((c.k=='b'||c.k=='m')&&c.hp>1?`<small>${'♥'.repeat(c.hp)}</small>`:'')):''}
function hud(){const g=G;$('qs').textContent=`⏱ ${Math.max(0,Math.ceil(g.left))}초 · ${g.t=='weed'?'🌿':'👾'} ${g.score}/${g.T.goal}${g.t=='hunt'?' · '+'❤️'.repeat(Math.max(0,g.hearts)):''}`}
function tick2(){
  const g=G;if(!g)return;g.left-=.1;g.sp-=.1;
  g.cells.forEach((c,i)=>{if(!c)return;c.ttl-=.1;if(c.ttl<=0){if(g.t=='hunt'&&(c.k=='m'||c.k=='b'))g.hearts--;g.cells[i]=null;paint(i)}});
  if(g.sp<=0){g.sp=g.rate();const e=g.cells.map((c,i)=>c?-1:i).filter(i=>i>=0);
    if(e.length){const i=e[Math.floor(Math.random()*e.length)],r=Math.random();
      let k=g.t=='weed'?(r<.64?'w':r<.8?'g':'f'):(r<.76?'m':'b');
      g.cells[i]={k,ttl:KD[k][2],hp:k=='b'?(g.cur=='hachi'?2:3):1};paint(i)}}
  hud();
  if(g.score>=g.T.goal)finish(true);else if(g.hearts<=0&&g.t=='hunt'||g.left<=0)finish(false);
}
function hit(i){
  const g=G;if(!g||g.idle||!g.cells[i])return;const c=g.cells[i];
  if(c.k=='m'||c.k=='b'){c.hp--;if(c.hp<=0){g.score++;g.cells[i]={k:'ok',ttl:.3}}}
  else if(c.k=='f'){g.score=Math.max(0,g.score-2);g.cells[i]={k:'no',ttl:.3}}
  else{g.score+=KD[c.k][1];g.cells[i]={k:'ok',ttl:.3}}
  paint(i);hud();
}
function finish(win){
  const g=G,id=g.cur,S=s[id],c=byId[id];stopG();
  let coin=0;
  if(win){coin=g.t=='weed'?Math.min(30,12+Math.max(0,g.score-g.T.goal)):25+Math.max(0,g.hearts)*3;if(id=='usagi')coin=Math.round(coin*1.2)}
  coins+=coin;S.e=cl(S.e-(g.t=='weed'?8:14));S.h=cl(S.h-(g.t=='weed'?6:10));S.m=cl(S.m+(win?10:-4));
  const L0=lv(S.b);S.b+=win?5:1;
  $('qr').innerHTML=`<div class="res"><b style="font-family:Jua;font-size:22px">${win?'🎉 성공!':'😢 아쉬워요'}</b><p>${win?`보수로 🪙 ${coin}개를 받았어요!`:'보수를 받지 못했어요. 다시 도전해 봐요!'}<br>${c.n}: “${QL[id][win?'win':'lose']}”${lv(S.b)>L0?`<br>✨ 레벨 업! Lv.${lv(S.b)}`:''}</p><button class="chip" id="qok">확인</button></div>`;
  ui();
}
function drawShop(msg=''){
  const c=byId[cur];
  $('qs').textContent='🪙 '+coins;$('qg').className='shop';$('qg').style.removeProperty('--cols');
  $('qg').innerHTML=`<div class="tabs">${D.map(d=>`<button class="chip" data-c="${d.id}" aria-pressed="${d.id==cur}">${d.n}</button>`).join('')}</div><div class="pv">${face(c,'idle')}</div><div class="cg">${CO.map(o=>{const on=(wear[cur]||{})[o.s]==o.id,has=own.includes(o.id);return `<button class="co${on?' on':''}" data-o="${o.id}"><b>${o.i}</b>${o.n}<small>${on?'착용 중':has?'착용하기':'🪙 '+o.p}</small></button>`}).join('')}</div>`;
  $('qr').innerHTML=msg?`<div class="res"><p>${msg}</p></div>`:'';
}
function pickCo(id){
  const o=CO.find(x=>x.id==id),w=wear[cur]||(wear[cur]={});
  if(!own.includes(id)){if(coins<o.p)return drawShop('코인이 모자라요. 풀뽑기와 토벌로 모아 봐요!');coins-=o.p;own.push(id);}
  if(w[o.s]==id)delete w[o.s];else{w[o.s]=id;say(cur,QL[cur].wear)}
  R(cur);ui();drawShop(`${o.n} 준비 완료!`);
}
$('qg').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.cell');if(b){e.preventDefault();hit(+b.dataset.i)}
});
$('qm').addEventListener('click',e=>{
  const t=e.target;
  if(t.id=='qx'||t.id=='qok'||t==qm)return closeM();
  if(t.id=='qgo')return begin();
  const c=t.closest('[data-c]');if(c){cur=c.dataset.c;ui();return drawShop()}
  const o=t.closest('[data-o]');if(o)pickCo(o.dataset.o);
});
addEventListener('keydown',e=>{if(e.key=='Escape'&&!qm.hidden)closeM()});
$('qacts').addEventListener('click',e=>{
  const b=e.target.closest('.a');if(!b)return;
  if(b.dataset.q=='shop'){openM('👗 코스튬 상점');drawShop()}else startQ(b.dataset.q);
});
D.forEach(c=>R(c.id));sky();ui();
</script>
</body>
</html>
