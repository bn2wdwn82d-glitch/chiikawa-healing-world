<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>✨ 먼작귀 힐링 월드 - 얼티밋 에디션 ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#4d3f55;--rose:#f58aa8;--gold:#ffd54a;--magic:#b79bff;--ocean:#7ec8ff;--mint:#7cc78c;--lavender:#cdb9f2;--coral:#ff6b9d;--sky:#8fd0ff;--peach:#ffb8a8;--purple:#9a78f0;--teal:#48b8a8;--orange:#ff9f5a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#7cc78c,#a8e19c,#b8e7b1,#93d49b,#7cc78c);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:background 2.5s;overflow-x:hidden;min-height:100vh}
body.theme-dark{background:linear-gradient(135deg,#17182b,#23233e,#302d50);color:#f3edf7}
body.theme-dark #scene{background:linear-gradient(180deg,#080c18 0%,#141435 35%,#2a2860 70%,#3a3560 100%)}
body.theme-dark #scene #night,body.theme-dark #scene #stars{opacity:1}
body.n{background:linear-gradient(135deg,#24483c,#2a2860,#4a4478,#3a3d6c,#24483c)}
body.dusk{background:linear-gradient(135deg,#d4a574,#e8b88a,#f0c8a0,#e8b88a,#d4a574)}
#app{display:flex;flex-direction:column;min-height:100dvh}
#scene{position:relative;flex:1;min-height:700px;overflow:hidden;background:linear-gradient(180deg,#8fd0ff 0%,#cfeeff 30%,#fff1dd 60%,#ffe8d4 80%,#ffd9c4 95%,#ffccaa 100%)}
#scene::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 12%,rgba(255,228,122,0.2) 0%,transparent 42%),radial-gradient(ellipse at 78% 88%,rgba(183,155,255,0.18) 0%,transparent 42%),radial-gradient(ellipse at 50% 50%,rgba(255,183,197,0.1) 0%,transparent 55%),radial-gradient(ellipse at 30% 70%,rgba(120,200,255,0.08) 0%,transparent 40%);pointer-events:none;z-index:4;animation:shimmer 28s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:0.62}20%{opacity:0.69}40%{opacity:0.64}60%{opacity:0.7}80%{opacity:0.65}}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(60,40,90,.1));pointer-events:none;z-index:5}
#dusk,#night{position:absolute;inset:0;opacity:0;transition:opacity 2.5s}
#dusk{background:linear-gradient(180deg,#ffa77c 0%,#ffd3b0 40%,#ffe8cf 70%,#fff5e8 90%,#ffebd8 100%)}
#night{background:linear-gradient(180deg,#080c18 0%,#141435 25%,#1a1a40 45%,#2a2860 65%,#4a4478 85%,#5a5090 100%)}
#scene.dusk #dusk,#scene.night #night{opacity:1}
#orb{position:absolute;right:6%;top:80px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 20% 20%,#fff8c8,#ffe27a,#ffc950,#ffaa30,#e09020);box-shadow:0 0 40px 12px rgba(255,231,154,.38),0 0 80px 28px rgba(255,200,100,.12),inset -12px -12px 30px rgba(255,180,50,.4);transition:all 2.5s;animation:float 12s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.01)}}
.night #orb{background:radial-gradient(circle at 20% 20%,#fffef8,#f0e8d0,#d4d8ff,#b8c0ff,#98a8f0);box-shadow:inset -22px -12px 0 0 #d4d8ff,0 0 70px 18px rgba(255,248,192,.4),0 0 120px 45px rgba(200,200,255,.2),0 0 180px 80px rgba(150,150,255,.12)}
#stars{position:absolute;inset:0;opacity:0;transition:opacity 2.5s}
.night #stars{opacity:1}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(255,255,255,.7),0 0 10px rgba(255,255,255,.28);animation:twinkle 8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(.9)}50%{opacity:.55;transform:scale(1.1)}}
.shooting-star{position:absolute;width:140px;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),#fff,rgba(255,255,255,.65),transparent);opacity:0;animation:shoot 24s ease-in-out infinite}
@keyframes shoot{0%,95%,100%{opacity:0;transform:translateX(0) translateY(0) rotate(-45deg)}96%{opacity:.45}100%{opacity:0;transform:translateX(500px) translateY(250px) rotate(-45deg)}}
.cl{position:absolute;left:-360px;top:90px;width:190px;height:54px;border-radius:60px;background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(255,255,255,.93),rgba(255,255,255,.8));animation:drift 110s linear infinite;transition:opacity 2.5s;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.cl::before,.cl::after{content:'';position:absolute;background:inherit;border-radius:50%;box-shadow:inset 0 -6px 14px rgba(0,0,0,.07)}
.cl::before{width:78px;height:78px;left:24px;top:-40px}.cl::after{width:62px;height:62px;left:100px;top:-27px}
.c2{top:170px;scale:.85;animation-duration:145s;animation-delay:-60s}
.c3{top:50px;scale:.7;animation-duration:125s;animation-delay:-85s}
.c4{top:250px;scale:.6;animation-duration:155s;animation-delay:-100s}
.c5{top:310px;scale:.5;animation-duration:175s;animation-delay:-115s}
.c6{top:360px;scale:.4;animation-duration:195s;animation-delay:-130s}
.night .cl{opacity:.1}
@keyframes drift{to{transform:translateX(calc(100vw + 720px))}}
.hills{position:absolute;left:0;right:0;bottom:0;height:50%;z-index:2;transition:filter 2.5s}
.hills i{position:absolute;border-radius:50%;box-shadow:0 14px 40px rgba(0,0,0,.14)}
.h1{left:-26%;width:95%;height:115%;bottom:-40%;background:linear-gradient(180deg,#cdb9f2,#b3d9c3,#8cd08a,#6bc078,#5ca068)}
.h2{right:-32%;width:110%;height:100%;bottom:-48%;background:linear-gradient(180deg,#b8e7b1,#93d49b,#7cc78c,#6bc078,#5ca068)}
.h3{left:-20%;right:-20%;height:86%;bottom:-50%;background:linear-gradient(180deg,#a8e19c,#7cc78c,#6bc078,#5ca068,#4ca058)}
.h4{left:22%;width:48%;height:38%;bottom:-54%;background:linear-gradient(180deg,#93d49b,#7cc78c,#6bc078);opacity:.68}
.h5{left:52%;width:38%;height:30%;bottom:-57%;background:linear-gradient(180deg,#7cc78c,#6bc078,#5ca068);opacity:.52}
.h6{left:10%;width:30%;height:24%;bottom:-58%;background:linear-gradient(180deg,#a8e19c,#7cc78c);opacity:.45}
.night .hills{filter:brightness(.3) saturate(.6)}
.dusk .hills{filter:brightness(.75) sepia(.3) saturate(1.3)}
.rainbow{position:absolute;left:0;right:0;bottom:18%;height:280px;opacity:0;transition:opacity 2.5s;pointer-events:none;z-index:1}
.rainbow.show{opacity:.5}
.rainbow::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(255,182,193,.38),rgba(255,218,185,.38),rgba(255,255,224,.38),rgba(144,238,144,.38),rgba(135,206,235,.38),rgba(147,112,219,.38),rgba(183,155,255,.38),rgba(200,180,255,.38),transparent);border-radius:50% 50% 0 0/100% 100% 0 0}
header{position:absolute;top:0;left:0;right:0;z-index:7;padding:28px 20px 0;text-align:center}
h1{margin:0 0 16px;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(40px,9vw,60px);letter-spacing:.12em;color:#fff;text-shadow:0 5px 0 #f58aa8,0 6px 0 #e9739a,0 7px 0 #d66c8a,0 12px 24px rgba(120,60,110,.45),0 0 32px rgba(245,138,168,.22);animation:titleGlow 16s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 5px 0 #f58aa8,0 6px 0 #e9739a,0 7px 0 #d66c8a,0 12px 24px rgba(120,60,110,.45),0 0 32px rgba(245,138,168,.22)}50%{text-shadow:0 5px 0 #f58aa8,0 6px 0 #e9739a,0 7px 0 #d66c8a,0 12px 24px rgba(120,60,110,.45),0 0 42px rgba(245,138,168,.3)}}
.ctl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{border:2px solid rgba(255,255,255,.94);background:rgba(255,255,255,.68);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:999px;padding:12px 20px;font:inherit;font-size:17px;color:var(--ink);cursor:pointer;box-shadow:0 6px 16px rgba(80,60,100,.18),0 4px 10px rgba(80,60,100,.12);transition:all .4s}
.chip:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(80,60,100,.25),0 5px 12px rgba(80,60,100,.16)}
.chip[aria-pressed=true]{background:linear-gradient(135deg,#ff9db9,#f58aa8,#e9739a);color:#fff;border-color:transparent;box-shadow:0 6px 24px rgba(245,138,168).5,0 0 40px rgba(245,138,168,.3)}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none}
#row{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:flex-start;align-items:flex-end;gap:clamp(8px,1.6vw,20px);z-index:3;padding:96px 12px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.65) rgba(255,255,255,.16);scroll-snap-type:x proximity}
.ch{position:relative;flex:0 0 clamp(90px,calc((100vw - 144px)/6),170px);width:clamp(90px,calc((100vw - 144px)/6),170px);scroll-snap-align:center;background:none;border:0;padding:0 0 12px;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .4s}
.ch:hover{transform:translateY(-10px)}
.ch::before{content:'';position:absolute;z-index:-1;left:4%;right:4%;bottom:36px;height:22px;border-radius:50%;background:rgba(30,60,40,.4);filter:blur(12px);transition:all .4s}
.ch:hover::before{height:30px;filter:blur(16px)}
.ch::after{display:none}
.ch.sel::after{opacity:1}
.ch.sel::before{background:rgba(245,138,168).5;filter:blur(20px)}
.face{display:block;animation:bob 4.5s ease-in-out infinite}
.ch:nth-child(2) .face{animation-delay:-1.5s}.ch:nth-child(3) .face{animation-delay:-3s}.ch:nth-child(4) .face{animation-delay:-4.5s}.ch:nth-child(5) .face{animation-delay:-6s}.ch:nth-child(6) .face{animation-delay:-7.5s}.ch:nth-child(7) .face{animation-delay:-9s}.ch:nth-child(8) .face{animation-delay:-10.5s}.ch:nth-child(9) .face{animation-delay:-12s}.ch:nth-child(10) .face{animation-delay:-13.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ch.hop .face{animation:hop .6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-6deg) scale(1.12)}}
.pic{position:relative;display:block;isolation:isolate}
.pic img{position:relative;z-index:1;display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 5px 8px rgba(40,35,55,.16));transform-origin:50% 92%;transition:filter .4s}
.ch:hover .pic img{filter:drop-shadow(0 7px 10px rgba(40,35,55,.2))}
.pic svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none;transform-origin:50% 92%}
.pic.fitdbg{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.pic svg.bk{z-index:0}
.st-eat img,.st-eat svg{animation:chew .4s 4}.st-sleep img,.st-sleep svg{animation:breathe 3.2s ease-in-out infinite}
@keyframes chew{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.86)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.92)}}
.nm{display:block;margin:6px auto 0;width:max-content;font-family:'Jua',sans-serif;font-size:17px;color:#fff;text-shadow:0 4px 8px rgba(60,40,70,.7),0 0 18px rgba(0,0,0,.28);border-radius:999px;padding:6px 20px;transition:all .4s}
.ch.sel .nm{background:linear-gradient(135deg,#ff9db9,#f58aa8,#e9739a);box-shadow:0 6px 22px rgba(245,138,168).7,0 0 35px rgba(245,138,168).4;text-shadow:none;padding:8px 24px}
.bub{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;width:max-content;max-width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;padding:12px 22px;border-radius:28px;background:linear-gradient(135deg,#fff,#fff5f8,#ffeef4,#ffe8f0);font-size:17px;line-height:1.6;box-shadow:0 8px 24px rgba(80,50,90,.2);opacity:0;transform:translate(-50%,-8px) scale(.96);transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:100;border:2px solid rgba(255,255,255,.94)}
.bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-12px;border:12px solid transparent;border-top-color:#fff}
.bub.on{opacity:1;transform:translate(-50%,0) scale(1)}
.zz{position:absolute;top:6%;right:14%;font-size:38px;animation:bob 2.2s infinite;text-shadow:0 0 14px rgba(255,255,255,.7)}
.fl{position:absolute;bottom:48%;font-size:34px;pointer-events:none;animation:rise 1.8s forwards;z-index:7;text-shadow:0 0 18px rgba(255,255,255,.7)}
@keyframes rise{0%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(-130px) scale(1.5);opacity:0}}
#panel{position:relative;z-index:6;margin:-45px auto 24px;width:min(680px,calc(100% - 36px));padding:24px 28px 28px;border-radius:40px;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.72));-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);border:2px solid rgba(255,255,255,.97);box-shadow:0 20px 64px rgba(70,50,100,.32),0 12px 36px rgba(70,50,100,.2),inset 0 3px 0 rgba(255,255,255,.92)}
.top{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.lvb{flex:none;position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff9db9,#b79bff,#7ec8ff,#ffd54a,#ff6b9d,#7ec8ff,#ff9db9);box-shadow:0 10px 24px rgba(150,110,200).5,0 0 50px rgba(183,155,255).4;animation:levelGlow 5s ease-in-out infinite}
@keyframes levelGlow{0%,100%{box-shadow:0 10px 24px rgba(150,110,200).5,0 0 50px rgba(183,155,255).4}50%{box-shadow:0 10px 24px rgba(150,110,200).5,0 0 70px rgba(183,155,255).6}}
.lvb::before{content:'';position:absolute;inset:7px;border-radius:50%;background:linear-gradient(135deg,#f58aa8,#a98bf0,#7ec8ff)}
.lvb span{position:relative;font-family:'Jua',sans-serif;font-size:21px;color:#fff;text-shadow:0 3px 6px rgba(0,0,0,.28)}
.top b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:28px;color:var(--ink)}
.top small{color:#8f7f99;font-size:16px}
.st{display:grid;grid-template-columns:84px 1fr 46px;gap:14px;align-items:center;font-size:16px;margin:12px 0}
.tr{height:17px;border-radius:15px;background:rgba(120,90,140,.16);overflow:hidden;box-shadow:inset 0 4px 8px rgba(80,50,100).22}
.tr i{display:block;height:100%;border-radius:15px;transition:width .8s cubic-bezier(0.34,1.56,0.64,1);box-shadow:inset 0 5px 0 rgba(255,255,255).6,0 4px 12px rgba(0,0,0).14}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px}
.a{border:0;border-radius:24px;padding:15px 5px 14px;background:linear-gradient(180deg,#fff,#fff1f6);box-shadow:0 6px 0 #ecd0dc,0 12px 24px rgba(150,100,140).18);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.a::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255).9,transparent);opacity:0;transition:opacity .4s}
.a:hover::before{opacity:1}
.a b{display:block;font-size:36px;font-weight:400;line-height:1.2;position:relative;z-index:1}
.a:hover{transform:translateY(-5px);box-shadow:0 8px 0 #ecd0dc,0 16px 28px rgba(150,100,140).22)}.a:active{transform:translateY(3px);box-shadow:0 4px 0 #ecd0dc,0 8px 16px rgba(150,100,140).14)}
:focus-visible{outline:3px solid #6a8cff;outline-offset:5px}
@media(max-width:640px){.acts{grid-template-columns:repeat(3,1fr)}#scene{min-height:600px}#row{gap:8px;bottom:38px}.ch{flex-basis:calc((100vw - 48px)/3);width:calc((100vw - 48px)/3);max-width:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.coin{margin-left:auto;font-family:'Jua',sans-serif;font-size:23px;background:linear-gradient(135deg,#fff3c4,#ffd86b,#ffc950,#e09020);border-radius:999px;padding:10px 20px;box-shadow:0 5px 0 #e0b030,0 10px 24px rgba(224,176,48).3);white-space:nowrap;position:relative;overflow:hidden}
.coin::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255).6,transparent);transform:rotate(45deg);animation:coinShine 4s ease-in-out infinite}
@keyframes coinShine{0%,100%{transform:translateX(-100%) rotate(45deg)}50%{transform:translateX(100%) rotate(45deg)}}
.acts.q{grid-template-columns:repeat(3,1fr);margin-top:14px}
.acts.q .a{background:linear-gradient(180deg,#fff,#eef6ff);box-shadow:0 6px 0 #c9dcf0,0 12px 24px rgba(100,130,160).18)}
.pic svg{overflow:visible}.pic svg.bk{z-index:0}
.extra-menu{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.extra-btn{border:2px solid rgba(255,255,255).92);background:rgba(255,255,255).65);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;padding:10px 18px;font-family:'Jua',sans-serif;font-size:15px;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px rgba(80,60,100).14);transition:all .35s}
.extra-btn:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(80,60,100).2)}
#qm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(60,40,80).6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#qm[hidden]{display:none}
.qb{width:min(600px,100%);max-height:92dvh;overflow:auto;background:linear-gradient(135deg,rgba(255,255,255).98),rgba(255,255,255).95));border-radius:38px;padding:28px;box-shadow:0 32px 96px rgba(40,20,70).5),0 16px 48px rgba(40,20,70).3)}
.qh{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.qh b{flex:1;font-family:'Jua',sans-serif;font-weight:400;font-size:26px;color:var(--ink)}
#qs{font-family:'Jua',sans-serif;font-size:18px;color:#8f7f99}
#qx{border:0;background:linear-gradient(135deg,#f3e6ec,#ffe3ec);border-radius:50%;width:46px;height:46px;font-size:21px;cursor:pointer;color:var(--ink);box-shadow:0 6px 16px rgba(80,60,100).2);transition:all .4s}
#qx:hover{transform:scale(1.15);box-shadow:0 8px 24px rgba(80,60,100).28)}
.board{display:grid;gap:14px;grid-template-columns:repeat(var(--cols),1fr);touch-action:manipulation}
.cell{aspect-ratio:1;border:0;border-radius:24px;font-size:clamp(32px,12vw,50px);line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:all .2s;-webkit-user-select:none;user-select:none;box-shadow:0 6px 16px rgba(0,0,0).14)}
.cell:hover{transform:scale(1.08)}
.cell:active{transform:scale(.82)}
.cell small{display:block;font-size:14px;color:#c23a52;min-height:18px}
.board.weed .cell{background:radial-gradient(circle at 30% 30%,#b9ea9e,#8cd08a,#6bc078,#5ca068);box-shadow:0 6px 16px rgba(76,144,76).24)}
.board.hunt .cell{background:radial-gradient(circle at 30% 30%,#9a7658,#6b4f3a,#4a3528,#3a2a18);box-shadow:0 6px 16px rgba(75,79,59).24)}
.board.fishing .cell{background:radial-gradient(circle at 30% 30%,#7ec8ff,#5eb4f5,#4a9ce8,#3a88d8);box-shadow:0 6px 16px rgba(78,180,255).24)}
.board.cooking .cell{background:radial-gradient(circle at 30% 30%,#ffd54a,#ffc950,#ffaa30,#e09020);box-shadow:0 6px 16px rgba(255,213,74).24)}
.board.puzzle .cell{background:radial-gradient(circle at 30% 30%,#b79bff,#9a78f0,#7a50d0,#6a30b0);box-shadow:0 6px 16px rgba(119,121,255).24)}
.board.music .cell{background:radial-gradient(circle at 30% 30%,#ff6b9d,#e8507a,#c83058,#a81038);box-shadow:0 6px 16px rgba(255,107,157).24)}
.res{text-align:center;margin-top:20px}
.res p{margin:12px 0 20px;line-height:1.8;font-size:17px}
.res .chip{background:linear-gradient(135deg,#ff9db9,#f58aa8,#e9739a);color:#fff;border-color:transparent;font-size:19px;padding:14px 38px;box-shadow:0 6px 24px rgba(245,138,168).5)}
.tabs{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.pv{width:170px;margin:0 auto 14px}

function showAchievement(id){
  if(achievements.includes(id))return;
  achievements.push(id);
  const a=ACHIEVEMENTS[id];
  const el=$('achievement');
  el.textContent=`🏆 ${a.n}`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),5000);
  save();
}

function updateStat(key,val=1){
  stats[key]=(stats[key]||0)+val;
  if(key==='playTime'&&stats.playTime>=3600&&!achievements.includes('play_time_1h'))showAchievement('play_time_1h');
  if(key==='playTime'&&stats.playTime>=36000&&!achievements.includes('play_time_10h'))showAchievement('play_time_10h');
  if(key==='playTime'&&stats.playTime>=360000&&!achievements.includes('play_time_100h'))showAchievement('play_time_100h');
  const h=new Date().getHours();
  if(h>=6&&h<9&&!achievements.includes('early_bird'))showAchievement('early_bird');
  if(h>=21&&h<24&&!achievements.includes('night_owl'))showAchievement('night_owl');
  save();
}

/* ===== 코스튬 자동 맞춤 =====
   사진에서 측정한 눈·머리·턱·손 위치(fitData)를 기준으로 코스튬 크기와 위치를 캐릭터마다 따로 계산합니다.
   자동으로 맞춘 뒤에도 마음에 안 드는 캐릭터가 있으면 아래 FIT_TWEAK 숫자만 바꾸면 됩니다.
   예) chii:{head:{dy:-1.5,s:1.1}}  → 치이카와 머리 코스튬을 1.5만큼 위로, 10% 크게
   (dx,dy 단위: 캐릭터 가로 폭의 1% / s: 크기 배율 / 슬롯: head·face·neck·back·hand)
   주소 뒤에 ?fit=1 을 붙이면 측정 위치(눈·머리 윗선·턱·손)가 표시돼서 확인하기 편해요. */
const FIT_TWEAK={chii:{},hachi:{},usagi:{},momonga:{},poyo:{},kuru:{}};

/* 사진이 없는 캐릭터(동그란 기본 얼굴)의 측정값 */
const fallbackFits={};
function fallbackFit(c){
  if(fallbackFits[c.id])return fallbackFits[c.id];
  const top=[];
  for(let k=0;k<=100;k++)top.push(Math.abs(k-50)<=35?Math.round((55-Math.sqrt(35*35-(k-50)*(k-50)))*100)/100:null);
  return fallbackFits[c.id]={h:100,hcx:50,hw:70,ht:20,ey:50,exL:40,exR:60,eyeR:4,eyeSep:20,my:63,chin:82,bottom:90,
    bodyCx:50,bodyW:62,hy:66,hxL:26,hxR:74,top,skin:c.body,auto:'fallback'};
}
const fitFor=c=>fitData[c.id]||fallbackFit(c);
function topAtFit(f,x){
  const t=f.top;
  if(!t){const r=f.hw/2,k=fitClamp((x-f.hcx)/r,-1,1);return f.ht+r*.9*(1-Math.sqrt(1-k*k))}
  const k=fitClamp(x,0,100),i=Math.floor(k),j=Math.min(100,i+1),a=t[i],b=t[j];
  if(a==null&&b==null)return f.ht;
  return a==null?b:b==null?a:a+(b-a)*(k-i);
}

/* 머리 코스튬: [원래 가로폭, 머리 폭 대비 목표 크기, 머리와 닿는 아랫선(코스튬 좌표), 위로 띄우는 정도] */
const HEAD_FIT={
  crown:[1.12,.5,.08,0],crown_ice:[1.12,.5,.08,0],berry:[1.32,.7,.2,0],flower:[1.7,.8,.15,0],tophat:[1.24,.58,.17,0],
  star:[1,.22,0,0],cat_ears:[1,.64,-.3,0],bunny_ears:[.74,.44,-.25,0],wizard_hat:[.8,.56,.14,0],santa_hat:[.8,.52,.14,0],
  chef_hat:[.64,.46,.1,0],halo:[.8,.5,0,.4],witch_hat:[.7,.56,.14,0],pirate_hat:[1,.68,.15,0]
};
const FACE_LENS={glass:.5,heart:.5,glasses:.22};                       // 렌즈 중심이 눈에 오도록
const NECK_FIT={bell:[1.7,.66],bowtie:[1,.3],scarf:[2.2,.74],necklace_pearl:[1.6,.62]};
const BACK_HALF={wing:3.1,angel_wing:3.3,devil_wing:3.4};               // 날개 한쪽 길이(코스튬 좌표)
const HAND_FIT={sword:[.556,.4],magic_wand:[.48,.4],shield:[.47,0]};     // [크기, 손잡이 위치]

const fitTweak=(c,slot)=>((FIT_TWEAK[c.id]||{})[slot])||{};

/* 직접 그린 코스튬(COS)에 넘길 기준값 */
function anchorFor(c,id,slot){
  const f=fitFor(c),hw=f.hw,tw=fitTweak(c,slot),sc=tw.s||1,dx=tw.dx||0,dy=tw.dy||0;
  const a={body:c.body,w:100,h:f.h,d:1,cx:0,ht:f.ht,ey:f.ey,my:f.chin};
  const put=(cx,u)=>{u*=sc;a.cx=(cx+dx-50)/16;a.d=u/16;return u};
  if(slot==='head'){
    if(id==='ribbon'||id==='ribbon_pink'){
      const off=id==='ribbon'?.75:.6,u=put(f.hcx,(id==='ribbon'?.4:.62)*hw);
      a.ht=topAtFit(f,f.hcx+dx+off*u)+.02*u+dy;return a;
    }
    const [nw,tr,base,up]=HEAD_FIT[id]||[1,.6,0,0],u=put(f.hcx,tr*hw/nw);
    a.ht=f.ht+.2*u-base*u-up*u+dy;return a;
  }
  if(slot==='face'){
    put((f.exL+f.exR)/2,(f.eyeSep/2)/(FACE_LENS[id]||.5));
    a.ey=f.ey+dy;return a;
  }
  if(slot==='neck'){
    const [nw,tr]=NECK_FIT[id]||[1.6,.66];put(f.hcx,tr*hw/nw);
    a.my=f.chin-.02*hw+dy;return a;
  }
  if(slot==='back'){
    const half=BACK_HALF[id]||3.2;put(f.hcx,(f.bodyW/2+.2*hw)/half);
    a.ey=f.chin-.08*hw+dy;return a;
  }
  /* hand */
  const [len,grip]=HAND_FIT[id]||[.5,0],u=put(f.hcx,len*hw),hx=id==='shield'?f.hxL:f.hxR;
  a.handX=a.shieldX=(hx-f.hcx)/u;
  a.my=f.hy-grip*u+dy;return a;
}

/* 이모지·간단한 모양으로 된 코스튬도 같은 방식으로 캐릭터에 맞춤 */
function genericCostume(id,c,slot){
  const item=CO.find(costume=>costume.id===id);
  if(!item)return '';
  const f=fitFor(c),hw=f.hw,tw=fitTweak(c,slot),sc=tw.s||1,dx=tw.dx||0,dy=tw.dy||0;
  if(slot==='back'){
    const wing=id.includes('wing');
    const color=id.includes('devil')||id.includes('bat')||id.includes('shadow')?'#745b91':id.includes('ice')||id.includes('bird')||id.includes('ocean')||id.includes('sky')?'#8ec9e8':id.includes('fairy')||id.includes('butterfly')?'#f3a6c8':'#ed9a72';
    const capeColor=id.includes('ice')||id.includes('ocean')||id.includes('sky')?'#82c7e7':id.includes('shadow')||id.includes('bat')?'#79618e':id.includes('nature')||id.includes('earth')?'#83bb79':id.includes('fire')||id.includes('phoenix')?'#f28b6c':'#c39be8';
    const s=(wing?(f.bodyW/2+.2*hw)/43:(f.bodyW/2*1.0+.06*hw)/27)*sc;
    const wrap=b=>`<g transform="translate(${f.hcx+dx} ${f.chin-.08*hw+dy}) scale(${s}) translate(-50 0)">${b}</g>`;
    if(wing)return wrap(`<path d="M49 -9C39 -20 20 -22 7 -13C17 -11 19 -2 32 5C38 0 44 -2 49 -4Z" fill="${color}" stroke="#74677b" stroke-width="1.6"/><path d="M51 -9C61 -20 80 -22 93 -13C83 -11 81 -2 68 5C62 0 56 -2 51 -4Z" fill="${color}" stroke="#74677b" stroke-width="1.6"/>`);
    const cape=`<path d="M36 -9Q28 -11 23 -3L29 15Q50 8 71 15L77 -3Q72 -11 64 -9Q50 -3 36 -9Z" fill="${capeColor}" stroke="#74677b" stroke-width="1.6"/>`;
    return wrap(id==='rainbow_cape'?cape+`<path d="M31 -5Q50 2 69 -5M29 0Q50 7 71 0" fill="none" stroke="#ffd36e" stroke-width="2"/>`:cape);
  }
  let x=f.hcx,y=f.ht,fs=hw*.44;
  if(slot==='head'){y=f.ht-.3*fs}
  else if(slot==='face'){
    /* 이모지 한 개짜리 안경·귀걸이는 양쪽에 한 쌍으로 달아줌 */
    const pair=(xa,xb,yy,size)=>[xa,xb].map(px=>`<text x="${(px+dx).toFixed(2)}" y="${(yy+dy).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="${(size*sc).toFixed(2)}">${item.i}</text>`).join('');
    if(id.includes('earring'))return pair(f.hcx-hw*.47,f.hcx+hw*.47,f.ey+hw*.14,hw*.15);
    return pair(f.exL,f.exR,f.ey,f.eyeSep*.5);
  }else if(slot==='neck'){fs=hw*.24;y=f.chin}
  else{
    const small=/_ring$|_bracelet$/.test(id);
    fs=hw*(small?.17:.34);x=id.includes('shield')?f.hxL:f.hxR;y=f.hy-(small?0:.12*hw);
  }
  fs*=sc;
  return `<text x="${(x+dx).toFixed(2)}" y="${(y+dy).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="${fs.toFixed(2)}">${item.i}</text>`;
}

/* 잘 때 눈을 감은 모습: 사진에서 측정한 눈 위치와 얼굴색에 맞춰 덮음 */
function sleepOverlay(c,f){
  const bg=f.skin||c.body,r=f.eyeR*1.5;
  return [f.exL,f.exR].map(x=>`<ellipse cx="${x}" cy="${f.ey}" rx="${(r*1.25).toFixed(2)}" ry="${(r*1.35).toFixed(2)}" fill="${bg}"/><path d="M${(x-r).toFixed(2)} ${f.ey}q${r.toFixed(2)} ${(r*.95).toFixed(2)} ${(r*2).toFixed(2)} 0" stroke="#3b2f3d" stroke-width="${(r*.26).toFixed(2)}" fill="none" stroke-linecap="round"/>`).join('');
}

/* ?fit=1 확인용: 측정된 위치 표시 */
function fitDebugShapes(f){
  return `<g fill="none" stroke-width=".35" stroke="#e33"><circle cx="${f.exL}" cy="${f.ey}" r="${f.eyeR}"/><circle cx="${f.exR}" cy="${f.ey}" r="${f.eyeR}"/>`+
    `<path d="M${f.hcx-f.hw/2} ${f.ht}H${f.hcx+f.hw/2}"/><path d="M${f.hcx-f.hw/2} ${f.chin}H${f.hcx+f.hw/2}" stroke="#36f"/>`+
    `<circle cx="${f.hxL}" cy="${f.hy}" r="1.6" stroke="#2a2"/><circle cx="${f.hxR}" cy="${f.hy}" r="1.6" stroke="#2a2"/></g>`;
}

function face(c,st){
  const f=fitFor(c),w=wear[c.id]||{};
  const cs=k=>{const id=w[k];if(!id)return '';return COS[id]?COS[id](anchorFor(c,id,k)):genericCostume(id,c,k)};
  /* 얼굴이 기울어진 사진(모몽가·랏코·카니)은 코스튬도 같은 각도로 기울임 */
  const tilt=b=>f.rot?`<g transform="rotate(${f.rot} ${f.hcx} ${f.ey})">${b}</g>`:b;
  const sv=(b,cl='')=>`<svg ${cl} viewBox="0 0 100 ${f.h}" preserveAspectRatio="none">${tilt(b)}</svg>`;
  const ov=st=='sleep'?sleepOverlay(c,f):'';
  const back=cs('back');
  const src=transparentImages[c.id]||IMG[c.id]||fallbackCharacterImage(c);
  return `<span class="pic st-${st}${FITDEBUG?' fitdbg':''}">${back?sv(back,'class="bk"'):''}<img src="${src}" alt="${c.n}" draggable="false">${sv(ov+cs('neck')+cs('face')+cs('head')+cs('hand')+(FITDEBUG?fitDebugShapes(f):''))}</span>`;
}

function loadMusicFiles(files){
  const selected=Array.from(files||[]).filter(file=>file.type.startsWith('audio/'));
  if(!selected.length)return showNotification('재생할 수 있는 오디오 파일을 선택해 주세요.');
  musicUrls.forEach(url=>URL.revokeObjectURL(url));
  musicFiles=selected;musicUrls=musicFiles.map(file=>URL.createObjectURL(file));currentMusic=0;musicPlaying=false;
  showMusic();
  toggleMusic();
}
function toggleMusic(){
  const audio=$('musicAudio');
  if(!audio)return showNotification('먼저 음악 파일을 선택해 주세요.');
  if(settings.sound===false)return showNotification('설정에서 사운드를 켜 주세요.');
  if(audio.paused){
    audio.play().then(()=>{musicPlaying=true;const button=document.querySelector('.music-controls .music-btn:nth-child(2)');if(button){button.textContent='⏸️';button.setAttribute('aria-label','일시 정지')}}).catch(()=>showNotification('음악을 재생하지 못했습니다. 다른 오디오 파일을 선택해 주세요.'));
  }else{audio.pause();musicPlaying=false;const button=document.querySelector('.music-controls .music-btn:nth-child(2)');if(button){button.textContent='▶️';button.setAttribute('aria-label','재생')}}
}
function nextMusic(){
  if(!musicFiles.length)return showNotification('먼저 음악 파일을 선택해 주세요.');
  currentMusic=(currentMusic+1)%musicFiles.length;musicPlaying=false;
  showMusic();
  toggleMusic();
}
function prevMusic(){

function updateEventTimer(){
  if(!eventActive||!eventEndTime)return;
  const remaining=eventEndTime-Date.now();
  if(remaining<=0){
    eventActive=false;
    eventEndTime=null;
    $('holidayBanner').classList.remove('show');
    closeEventModal();
    showNotification('이벤트가 종료되었습니다!');
    save();
    return;
  }
  const hours=Math.floor(remaining/3600000);
  const minutes=Math.floor((remaining%3600000)/60000);
  const seconds=Math.floor((remaining%60000)/1000);
  $('eventTimer').textContent=`${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

function pullGacha(){
  if(coins<50){showNotification('코인이 부족해요!');return}
  const machine=$('gachaMachine');
  if(!machine||machine.classList.contains('spinning'))return;
  coins-=50;
  machine.classList.add('spinning');
  setTimeout(()=>{
    if(!machine.isConnected)return;
    machine.classList.remove('spinning');
    const weight={common:70,uncommon:24,rare:5,legendary:1};
    const totalWeight=COLLECTION_ITEMS.reduce((sum,item)=>sum+(weight[item.r]||0),0);
    let pick=Math.random()*totalWeight;
    const item=COLLECTION_ITEMS.find(candidate=>{pick-=weight[candidate.r]||0;return pick<0})||COLLECTION_ITEMS[0];
    const alreadyCollected=!!collection[item.id];
    collection[item.id]=true;
    $('gachaResult').innerHTML=`
      <div class="gacha-item">${item.i}</div>
      <div class="gacha-name">${item.n}</div>
      <div class="gacha-rarity rarity-${item.r}">${item.r.toUpperCase()}</div>
      <small>${alreadyCollected?'이미 모은 아이템이에요.':'컬렉션에 추가했어요!'}</small>
    `;
    gachaHistory.push({item,time:Date.now()});
    if(gachaHistory.length>100)gachaHistory.shift();
    if(!alreadyCollected&&Object.keys(collection).length>=COLLECTION_ITEMS.length/2&&!achievements.includes('collector_50'))showAchievement('collector_50');
    save();
    ui();
  },2000);
}
const PREMIUM_REWARDS=[
  {icon:'🎁',name:'코인 100',type:'coins',amount:100},
  {icon:'💎',name:'코인 200',type:'coins',amount:200},
  {icon:'👑',name:'코스튬',type:'costume'},
  {icon:'🪄',name:'희귀 컬렉션 아이템',type:'collection',rarity:'rare'},
  {icon:'🔮',name:'전설 컬렉션 아이템',type:'collection',rarity:'legendary'},
  {icon:'🌟',name:'코인 300',type:'coins',amount:300},
  {icon:'⭐',name:'코스튬',type:'costume'},
  {icon:'🎀',name:'희귀 컬렉션 아이템',type:'collection',rarity:'rare'},
  {icon:'🌸',name:'전설 컬렉션 아이템',type:'collection',rarity:'legendary'},
  {icon:'🎉',name:'코인 500',type:'coins',amount:500},
  {icon:'🎁',name:'코스튬',type:'costume'},
  {icon:'💎',name:'전설 컬렉션 아이템',type:'collection',rarity:'legendary'}
];
function grantPremiumReward(level){
  const reward=PREMIUM_REWARDS[(level-1)%PREMIUM_REWARDS.length];
  if(reward.type==='coins'){
    coins+=reward.amount;
    return `코인 ${reward.amount}개`;
  }
  if(reward.type==='costume'){
    const costume=CO.find(item=>!own.includes(item.id));
    if(costume){own.push(costume.id);return costume.n}
    coins+=150;
    return '코인 150개 (코스튬 보유 보상)';
  }
  const item=COLLECTION_ITEMS.find(candidate=>candidate.r===reward.rarity&&!collection[candidate.id]);
  if(item){collection[item.id]=true;return item.n}
  coins+=reward.rarity==='legendary'?300:200;
  return `코인 ${reward.rarity==='legendary'?300:200}개 (컬렉션 보유 보상)`;
}
function claimPremiumRewards(){
  const claimed=new Set(premiumRewardsClaimed);
  const newlyGranted=[];
  for(let level=1;level<=premiumLevel;level++){
    if(claimed.has(level))continue;
    newlyGranted.push({level,reward:grantPremiumReward(level)});
    claimed.add(level);
  }
  if(newlyGranted.length){
    premiumRewardsClaimed=[...claimed].sort((a,b)=>a-b);
    save();
    showNotification(`프리미엄 보상 ${newlyGranted.length}개를 지급했어요!`);
  }
  return newlyGranted;
}
function showPremiumPass(){
  claimPremiumRewards();
  openM('💎 프리미엄 패스');
  $('qs').textContent=`레벨 ${premiumLevel}`;
  $('qg').className='premium';$('qg').style.removeProperty('--cols');
  const nextLevelXP=(premiumLevel+1)*100;
  const levelCount=Math.max(PREMIUM_REWARDS.length,premiumLevel+1);
  $('qg').innerHTML=`
    <div class="premium-pass">
      <div class="premium-pass-header">
        <b>프리미엄 패스</b>
        <span>XP: ${premiumXP}/${nextLevelXP}</span>
      </div>
      <div class="premium-level">
        ${Array.from({length:levelCount},(_,i)=>`
          <div class="premium-level-item ${i+1<=premiumLevel?'unlocked':''}">
            <b>Lv.${i+1}</b>
            <small>${i===0?0:(i+1)*100}XP</small>
          </div>
        `).join('')}
      </div>
      <div class="premium-rewards">
        ${Array.from({length:levelCount},(_,i)=>{
          const reward=PREMIUM_REWARDS[i%PREMIUM_REWARDS.length];
          const level=i+1,claimed=premiumRewardsClaimed.includes(level);
          return `<div class="premium-reward ${claimed?'unlocked':''}">
            <div class="premium-reward-icon">${reward.icon}</div>
            <div class="premium-reward-info"><b>Lv.${level} 보상 ${claimed?'· 받음':level<=premiumLevel?'· 지급 대기':'· 잠김'}</b><small>${reward.name}</small></div>
          </div>
        `}).join('')}
      </div>
    </div>
  `;
  $('qr').innerHTML='<div class="res"><button class="chip" onclick="gainPremiumXP()">XP 획득 (+50)</button></div>';
}
function gainPremiumXP(){
  premiumXP+=50;
  while(premiumXP>=(premiumLevel+1)*100){
    premiumXP-=(premiumLevel+1)*100;
    premiumLevel++;
  }
  claimPremiumRewards();
  if(premiumLevel>0)showNotification(`프리미엄 레벨 ${premiumLevel} · 보상을 지급했어요!`);
  save();
  showPremiumPass();
}
function showMinigameHistory(){
  openM('📜 게임 기록');
  $('qs').textContent=`미니게임 ${gameHistory.length}회 · 가차 ${gachaHistory.length}회`;
  $('qg').className='history';$('qg').style.removeProperty('--cols');
  $('qg').innerHTML=`
    <div class="minigame-history">
      <h3>미니게임 기록</h3>
      ${gameHistory.length===0?'<p style="text-align:center;color:#8f7f99">아직 미니게임 기록이 없어요</p>':gameHistory.slice(-20).reverse().map(h=>`
        <div class="history-item">
          <div class="history-game">${h.game} · ${h.character}</div>
          <div class="history-result ${h.win?'history-win':'history-lose'}">${h.win?'성공':'실패'} (${h.score})</div>
        </div>
      `).join('')}
      <h3>가차 기록</h3>
      ${gachaHistory.length===0?'<p style="text-align:center;color:#8f7f99">아직 가차 기록이 없어요</p>':gachaHistory.slice(-20).reverse().map(h=>`
        <div class="history-item">
          <div class="history-game">${h.item.n}</div>
          <div class="history-result ${h.item.r==='legendary'?'history-win':'history-lose'}">${h.item.r}</div>
        </div>
      `).join('')}
    </div>
  `;
  $('qr').innerHTML='';
}
