<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>먼작귀 힐링 월드</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#5b4a5e;--pink:#ff9fb8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#9fdcff;color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#app{display:flex;flex-direction:column;min-height:100dvh}
#scene{position:relative;flex:1;min-height:420px;overflow:hidden;background:linear-gradient(#9fdcff,#e6f7ff 70%)}
#dusk,#night{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
#dusk{background:linear-gradient(#ffb48a,#ffd9b8 65%,#ffe9d0)}
#night{background:linear-gradient(#141739,#2d2a5e 65%,#4a4478)}
#scene.dusk #dusk,#scene.night #night{opacity:1}
#orb{position:absolute;right:9%;top:110px;width:62px;height:62px;border-radius:50%;background:#ffe27a;box-shadow:0 0 36px #ffe79a;transition:all 1.5s}
.night #orb{background:#fffbe0;box-shadow:inset -14px -6px 0 0 #d4d8ff,0 0 30px #fff8c0}
#stars{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
.night #stars{opacity:1}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff}
.ground{position:absolute;left:-5%;right:-5%;bottom:0;height:30%;background:linear-gradient(#c3ecaa,#8fd18f);border-radius:50% 50% 0 0/28px 28px 0 0;transition:filter 1.5s}
.night .ground{filter:brightness(.45) saturate(.8)}
.dusk .ground{filter:brightness(.85) sepia(.3)}
header{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 14px 0;text-align:center}
h1{margin:0 0 8px;font-weight:400;font-size:clamp(26px,6vw,38px);color:#ff7fa3;text-shadow:0 2px 0 #fff,0 0 12px #fff}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:2px solid #fff;background:rgba(255,255,255,.75);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--pink);color:#fff}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none}
#row{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:center;gap:clamp(4px,3vw,34px);z-index:3}
.ch{position:relative;width:clamp(96px,27vw,150px);background:none;border:0;padding:0;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.face svg{display:block;width:100%;overflow:visible;animation:bob 3s ease-in-out infinite}
.ch:nth-child(2) svg{animation-delay:-1s}.ch:nth-child(3) svg{animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-5px)}}
.ch.hop .face{animation:hop .45s}
@keyframes hop{40%{transform:translateY(-22px) scale(1.04)}}
.nm{display:block;margin:2px auto 0;width:max-content;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);border-radius:999px;padding:1px 10px}
.ch.sel .nm{background:var(--pink);text-shadow:none}
.bub{position:absolute;bottom:92%;left:50%;width:max-content;max-width:min(190px,44vw);padding:8px 12px;border-radius:16px;background:#fff;font-size:14px;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.15);opacity:0;transform:translate(-50%,6px) scale(.85);transition:.2s;pointer-events:none;z-index:6}
.bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.bub.on{opacity:1;transform:translate(-50%,0) scale(1)}
.zz{position:absolute;top:2%;right:8%;font-size:24px;animation:bob 1.6s infinite}
.fl{position:absolute;bottom:60%;font-size:22px;pointer-events:none;animation:rise 1.2s forwards;z-index:7}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
#panel{background:rgba(255,255,255,.94);padding:12px 14px 16px;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:6}
.in{max-width:560px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.top b{font-weight:400;font-size:20px}
.top small{color:#a08a98}
.st{display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.tr{height:10px;border-radius:9px;background:#f3e6ec;overflow:hidden}
.tr i{display:block;height:100%;border-radius:9px;transition:width .4s}
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.a{border:0;border-radius:16px;padding:8px 2px;background:#fff6f9;box-shadow:0 2px 0 #ecd5de;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.a b{display:block;font-size:24px;font-weight:400}
.a:active{transform:translateY(2px);box-shadow:none}
:focus-visible{outline:3px solid #6a8cff;outline-offset:2px}
@media(max-width:520px){.acts{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
<div id="scene">
  <div id="dusk"></div><div id="night"></div><div id="stars"></div><div id="orb"></div>
  <header><h1>먼작귀 힐링 월드</h1><div class="ctl" id="ctl"></div></header>
  <div class="ground"></div>
  <div id="row"></div>
  <canvas id="fx"></canvas>
</div>
<section id="panel"><div class="in">
  <div class="top"><b id="nm"></b><small id="hint">캐릭터를 눌러 말을 걸어보세요</small></div>
  <div class="st"><span>배부름</span><div class="tr"><i id="bh" style="background:#ffb36b"></i></div><span id="vh"></span></div>
  <div class="st"><span>기분</span><div class="tr"><i id="bm" style="background:#ff8fb0"></i></div><span id="vm"></span></div>
  <div class="st"><span>에너지</span><div class="tr"><i id="be" style="background:#7ec8ff"></i></div><span id="ve"></span></div>
  <div class="st"><span>친밀도</span><div class="tr"><i id="bb" style="background:#b79bff"></i></div><span id="vb"></span></div>
  <div class="acts" id="acts"></div>
</div></section>
</div>
<script>
const $=id=>document.getElementById(id);
const D=[
{id:'chii',n:'치이카와',e:'round',body:'#fffaf7',acc:'#ffc9d6',fs:'🍓',pe:6,
 L:['으아… 나 여기 있어도 돼?','오늘도 열심히 해볼게!','따뜻해서 좋다아…','두근두근… 가까이 가도 돼?','같이 있으면 안심돼'],
 N:'별이 예쁘다… 조금 졸려',W:{rain:'비다… 우산 같이 쓸래?',snow:'눈이다! 손이 차가워도 괜찮아',sakura:'꽃잎이 머리에 앉았어!'},
 F:'딸기다! 너무 기뻐서 눈물 날 것 같아…',O:'고마워… 맛있어!',M:'밥이다… 잘 먹겠습니다!',P:'숨바꼭질? 놀라지 않게 살살 해줘…',S:'쿨… 쿨…',A:'으음… 푹 잤어! 고마워',X:'배불러서 더는 못 먹겠어…',T:'너무 피곤해… 조금만 쉬고 싶어',G:'배에서 꼬르륵 소리가 났어…'},
{id:'hachi',n:'하치와레',e:'cat',body:'#f4fbff',acc:'#9fd4ff',fs:'🍪',pe:12,
 L:['좋아~! 해보자!','하나, 둘! 기운이 넘쳐!','야호~! 오늘도 최고야!','같이 달리자!','내가 지켜줄게!'],
 N:'밤인데도 눈이 말똥말똥!',W:{rain:'물웅덩이 첨벙첨벙! 신난다!',snow:'눈싸움하자! 받아라!',sakura:'꽃잎 잡기 시합이야!'},
 F:'쿠키다! 바삭바삭 최고야!',O:'냠냠! 다음엔 쿠키도 줘!',M:'밥 먹고 힘 팍팍 낼게!',P:'와~! 한 번 더, 한 번 더!',S:'드르렁… 더 달릴 수 있는데…',A:'기지개 쭈욱~ 힘이 솟아!',X:'배불러~! 이제 놀자!',T:'헉헉… 잠깐 쉬어도 돼?',G:'배고파서 힘이 안 나~!'},
{id:'usagi',n:'우사기',e:'rabbit',body:'#fff9d8',acc:'#ffe27a',fs:'🍡',pe:8,
 L:['야하!','우라~ 우라~!','후훗, 놀랐지?','간식 줘, 간식!','푸하하! 재밌다!'],
 N:'밤엔 몰래 장난쳐도 되려나?',W:{rain:'우산 없이 빙글빙글~!',snow:'눈사람 만들어서 놀래켜야지!',sakura:'꽃잎 비다! 푸하하!'},
 F:'경단이다! 야하~! 하나 더!',O:'음… 이것도 괜찮네! 그래도 경단이 최고',M:'밥도 먹고 간식도 먹을래!',P:'장난 대성공! 푸하하!',S:'쿠우… (장난치는 꿈 중)',A:'잘 잤다! 이제 장난칠 시간이야!',X:'배불러서 데굴데굴~',T:'장난칠 힘이 없어… 눕고 싶어',G:'배고파서 장난칠 힘도 없어!'}
];
const K='#7a6672',byId={};D.forEach(c=>byId[c.id]=c);
let s={},wx='sakura',tm='auto',cur=D[0].id,tmp={};
try{const v=JSON.parse(localStorage.getItem('mjw1'));if(v){s=v.s||{};wx=v.wx||wx}}catch(e){}
D.forEach(c=>{s[c.id]=Object.assign({h:70,m:70,e:80,b:0,z:false},s[c.id]);s[c.id].z=false});
const save=()=>{try{localStorage.setItem('mjw1',JSON.stringify({s,wx}))}catch(e){}};
const lv=b=>1+Math.floor(b/20),tier=b=>b<30?'어색한 사이':b<80?'친구':b<160?'단짝':'소울메이트';
const cl=v=>Math.max(0,Math.min(100,v));

function face(c,st){
  const a=c.body,o=`fill="${a}" stroke="${K}" stroke-width="2.5"`;
  let ears=c.e=='round'?`<circle cx="34" cy="36" r="13" ${o}/><circle cx="86" cy="36" r="13" ${o}/><circle cx="34" cy="36" r="6" fill="${c.acc}"/><circle cx="86" cy="36" r="6" fill="${c.acc}"/>`
   :c.e=='cat'?`<polygon points="28,52 32,12 60,34" ${o}/><polygon points="92,52 88,12 60,34" ${o}/><polygon points="36,42 37,24 50,34" fill="${c.acc}"/><polygon points="84,42 83,24 70,34" fill="${c.acc}"/>`
   :`<ellipse cx="40" cy="22" rx="10" ry="25" ${o}/><ellipse cx="80" cy="22" rx="10" ry="25" ${o}/><ellipse cx="40" cy="24" rx="4.5" ry="16" fill="${c.acc}"/><ellipse cx="80" cy="24" rx="4.5" ry="16" fill="${c.acc}"/>`;
  const cap=c.e=='cat'?`<path d="M16 70Q18 34 60 34Q102 34 104 70Q60 56 16 70Z" fill="${c.acc}" opacity=".85"/>`:'';
  const ln=`stroke="#3b2f3d" stroke-width="3" fill="none" stroke-linecap="round"`;
  const eyes=st=='sleep'?`<path d="M40 72q6 5 12 0M68 72q6 5 12 0" ${ln}/>`
   :st=='happy'||st=='eat'?`<path d="M40 74q6-8 12 0M68 74q6-8 12 0" ${ln}/>`
   :`<circle cx="46" cy="72" r="5" fill="#3b2f3d"/><circle cx="74" cy="72" r="5" fill="#3b2f3d"/><circle cx="47.5" cy="70.5" r="1.7" fill="#fff"/><circle cx="75.5" cy="70.5" r="1.7" fill="#fff"/>`;
  const mouth=st=='eat'?`<ellipse cx="60" cy="87" rx="5" ry="6" fill="#e0697f"/>`
   :st=='sleep'?`<circle cx="60" cy="86" r="2" fill="${K}"/>`
   :`<path d="M53 83q3.5 4 7 0q3.5 4 7 0" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 120 124"><ellipse cx="60" cy="119" rx="40" ry="5" fill="rgba(0,0,0,.14)"/>${ears}<ellipse cx="40" cy="112" rx="12" ry="7" ${o}/><ellipse cx="80" cy="112" rx="12" ry="7" ${o}/><ellipse cx="60" cy="74" rx="46" ry="40" ${o}/>${cap}${eyes}<ellipse cx="33" cy="84" rx="7" ry="4.5" fill="#ffb3c6" opacity=".7"/><ellipse cx="87" cy="84" rx="7" ry="4.5" fill="#ffb3c6" opacity=".7"/>${mouth}</svg>`;
}
const row=$('row');
row.innerHTML=D.map(c=>`<button class="ch" data-id="${c.id}" aria-label="${c.n}"><span class="bub"></span><span class="zz" hidden>💤</span><span class="face"></span><span class="nm">${c.n}</span></button>`).join('');
const el={};row.querySelectorAll('.ch').forEach(b=>el[b.dataset.id]=b);
function R(id){const S=s[id];el[id].querySelector('.face').innerHTML=face(byId[id],S.z?'sleep':tmp[id]||'idle');el[id].querySelector('.zz').hidden=!S.z}
function setFace(id,st,ms=1400){tmp[id]=st;R(id);setTimeout(()=>{tmp[id]=null;R(id)},ms)}
const bt={};
function say(id,t){const b=el[id].querySelector('.bub');b.textContent=t;b.classList.add('on');clearTimeout(bt[id]);bt[id]=setTimeout(()=>b.classList.remove('on'),3000);
  el[id].classList.remove('hop');void el[id].offsetWidth;el[id].classList.add('hop')}
function fl(id,t){const f=document.createElement('span');f.className='fl';f.textContent=t;f.style.left=(20+Math.random()*55)+'%';el[id].appendChild(f);setTimeout(()=>f.remove(),1300)}
const isNight=()=>{const h=new Date().getHours();return tm=='night'||(tm=='auto'&&(h>=19||h<5))};

function ui(){
  const c=byId[cur],S=s[cur];
  $('nm').textContent=`${c.n}  Lv.${lv(S.b)} · ${tier(S.b)}`;
  [['h','h'],['m','m'],['e','e']].forEach(([k,f])=>{$('b'+k).style.width=S[f]+'%';$('v'+k).textContent=Math.round(S[f])});
  $('bb').style.width=(S.b%20)*5+'%';$('vb').textContent=(S.b%20)+'/20';
  document.querySelectorAll('.ch').forEach(b=>b.classList.toggle('sel',b.dataset.id==cur));
  save();
}
function pick(id){
  const c=byId[id],S=s[id],p=[...c.L];
  if(isNight())p.push(c.N,c.N);
  if(wx in c.W)p.push(c.W[wx],c.W[wx]);
  if(S.h<25)p.push(c.G);if(S.e<20)p.push(c.T);
  return p[Math.floor(Math.random()*p.length)];
}
row.addEventListener('click',e=>{
  const b=e.target.closest('.ch');if(!b)return;
  cur=b.dataset.id;const S=s[cur];
  say(cur,S.z?byId[cur].S:pick(cur));if(!S.z){setFace(cur,'happy',900);fl(cur,'💗')}
  ui();
});
function act(t){
  const id=cur,c=byId[id],S=s[id];
  if(S.z)return say(id,c.S);
  let dh=0,dm=0,de=0,db=0,txt,st='happy',fx='💖';
  if(t=='sleep'){
    S.z=true;say(id,c.S);R(id);ui();
    setTimeout(()=>{S.z=false;S.e=cl(S.e+40);S.m=cl(S.m+(isNight()?12:6));S.b+=2;R(id);say(id,c.A);fl(id,'✨');ui()},5000);
    return;
  }
  if(t=='meal'){if(S.h>=92)return say(id,c.X);dh=30;dm=6;db=4;txt=c.M;st='eat';fx='🍙'}
  else if(t=='play'){if(S.h<20)return say(id,c.G);if(S.e<15)return say(id,c.T);de=-c.pe;dm=16;db=4;txt=c.P;fx='🎈'}
  else{if(S.h>=96)return say(id,c.X);const fav=t==c.fs;dh=8;dm=fav?16:8;db=fav?6:3;txt=fav?c.F:c.O;st='eat';fx=t}
  const L0=lv(S.b);
  S.h=cl(S.h+dh);S.m=cl(S.m+dm);S.e=cl(S.e+de);S.b+=db;
  if(lv(S.b)>L0){txt+=` (Lv.${lv(S.b)} 달성!)`;fx='🎉'}
  say(id,txt);setFace(id,st,1200);fl(id,fx);fl(id,'💗');ui();
}
const A=[['🍓','딸기','🍓'],['🍪','쿠키','🍪'],['🍡','경단','🍡'],['🍙','밥 먹이기','meal'],['🎈','놀아주기','play'],['🌙','재우기','sleep']];
$('acts').innerHTML=A.map(a=>`<button class="a" data-a="${a[2]}"><b>${a[0]}</b>${a[1]}</button>`).join('');
$('acts').addEventListener('click',e=>{const b=e.target.closest('.a');if(b)act(b.dataset.a)});

// 날씨·시간 컨트롤
const WX=[['clear','☀️ 맑음'],['rain','🌧️ 비'],['snow','❄️ 눈'],['sakura','🌸 벚꽃']];
const ctl=$('ctl');
ctl.innerHTML=WX.map(w=>`<button class="chip" data-w="${w[0]}" aria-pressed="false">${w[1]}</button>`).join('')+'<button class="chip" id="tmb"></button>';
function ctlUI(){ctl.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w==wx));
  $('tmb').textContent={auto:'🕒 자동',day:'🌞 낮',night:'🌙 밤'}[tm]}
ctl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  if(b.dataset.w){wx=b.dataset.w;save()}else{tm={auto:'day',day:'night',night:'auto'}[tm];sky()}ctlUI()});
const sc=$('scene');
function sky(){const h=new Date().getHours(),n=isNight(),d=tm=='auto'&&((h>=17&&h<19)||(h>=5&&h<7));
  sc.classList.toggle('night',n);sc.classList.toggle('dusk',d&&!n);ctlUI()}
$('stars').innerHTML=Array.from({length:26},()=>`<i style="left:${Math.random()*100}%;top:${Math.random()*45}%;opacity:${.4+Math.random()*.6}"></i>`).join('');

// 날씨 파티클
const cv=$('fx'),g=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=sc.clientWidth;H=cv.height=sc.clientHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<90;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),a:Math.random()*6});
function tick(){
  g.clearRect(0,0,W,H);
  if(wx!='clear')for(const p of P){
    if(wx=='rain'){p.y+=14+p.r*6;p.x-=2;g.strokeStyle='rgba(120,170,230,.75)';g.lineWidth=1.5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+2,p.y-14);g.stroke()}
    else if(wx=='snow'){p.y+=.8+p.r*1.4;p.x+=Math.sin(p.a+=.02)*.6;g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,2+p.r*3,0,7);g.fill()}
    else{p.y+=1+p.r*1.2;p.x+=Math.sin(p.a+=.025)*1.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle='#ffb7cb';g.beginPath();g.ellipse(0,0,6+p.r*3,3+p.r*2,0,0,7);g.fill();g.restore()}
    if(p.y>H+10||p.x<-20||p.x>W+20){p.y=-10;p.x=Math.random()*W}
  }
  requestAnimationFrame(tick);
}
tick();

// 시간 경과: 배고픔·기분·에너지가 서서히 줄어듦
setInterval(()=>{D.forEach(c=>{const S=s[c.id];S.h=cl(S.h-2);S.m=cl(S.m-(S.h<25?3:1));if(!S.z)S.e=cl(S.e-1)});ui()},6000);
setInterval(sky,30000);
D.forEach(c=>R(c.id));sky();ui();
</script>
</body>
</html>
