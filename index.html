<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>✨ 먼작귀 힐링 월드 - 얼티밋 에디션 ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#4d3f55;--rose:#f58aa8;--gold:#ffd54a;--magic:#b79bff;--ocean:#7ec8ff;--mint:#7cc78c;--lavender:#cdb9f2;--coral:#ff6b9d;--sky:#8fd0ff;--peach:#ffb8a8;--purple:#9a78f0;--teal:#48b8a8;--orange:#ff9f5a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#7cc78c,#a8e19c,#b8e7b1,#93d49b,#7cc78c);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:background 2.5s;overflow-x:hidden;min-height:100vh}
body.n{background:linear-gradient(135deg,#24483c,#2a2860,#4a4478,#3a3d6c,#24483c)}
body.dusk{background:linear-gradient(135deg,#d4a574,#e8b88a,#f0c8a0,#e8b88a,#d4a574)}
#app{display:flex;flex-direction:column;min-height:100dvh}
#scene{position:relative;flex:1;min-height:700px;overflow:hidden;background:linear-gradient(180deg,#8fd0ff 0%,#cfeeff 30%,#fff1dd 60%,#ffe8d4 80%,#ffd9c4 95%,#ffccaa 100%)}
#scene::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 12%,rgba(255,228,122,0.2) 0%,transparent 42%),radial-gradient(ellipse at 78% 88%,rgba(183,155,255,0.18) 0%,transparent 42%),radial-gradient(ellipse at 50% 50%,rgba(255,183,197,0.1) 0%,transparent 55%),radial-gradient(ellipse at 30% 70%,rgba(120,200,255,0.08) 0%,transparent 40%);pointer-events:none;z-index:4;animation:shimmer 12s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:0.55}20%{opacity:0.85}40%{opacity:0.65}60%{opacity:0.9}80%{opacity:0.7}}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(60,40,90,.1));pointer-events:none;z-index:5}
#dusk,#night{position:absolute;inset:0;opacity:0;transition:opacity 2.5s}
#dusk{background:linear-gradient(180deg,#ffa77c 0%,#ffd3b0 40%,#ffe8cf 70%,#fff5e8 90%,#ffebd8 100%)}
#night{background:linear-gradient(180deg,#080c18 0%,#141435 25%,#1a1a40 45%,#2a2860 65%,#4a4478 85%,#5a5090 100%)}
#scene.dusk #dusk,#scene.night #night{opacity:1}
#orb{position:absolute;right:6%;top:80px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 20% 20%,#fff8c8,#ffe27a,#ffc950,#ffaa30,#e09020);box-shadow:0 0 80px 20px rgba(255,231,154,.6),0 0 140px 50px rgba(255,200,100,.2),inset -12px -12px 30px rgba(255,180,50,.4);transition:all 2.5s;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-15px) scale(1.03)}}
.night #orb{background:radial-gradient(circle at 20% 20%,#fffef8,#f0e8d0,#d4d8ff,#b8c0ff,#98a8f0);box-shadow:inset -22px -12px 0 0 #d4d8ff,0 0 70px 18px rgba(255,248,192,.4),0 0 120px 45px rgba(200,200,255,.2),0 0 180px 80px rgba(150,150,255,.12)}
#stars{position:absolute;inset:0;opacity:0;transition:opacity 2.5s}
.night #stars{opacity:1}
#stars i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 24px rgba(255,255,255,.7),0 0 36px rgba(255,255,255,.4);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0.25;transform:scale(0.75)}50%{opacity:1;transform:scale(1.5)}}
.shooting-star{position:absolute;width:140px;height:4px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),#fff,rgba(255,255,255,.95),transparent);opacity:0;animation:shoot 8s ease-in-out infinite}
@keyframes shoot{0%,95%,100%{opacity:0;transform:translateX(0) translateY(0) rotate(-45deg)}96%{opacity:1}100%{opacity:0;transform:translateX(500px) translateY(250px) rotate(-45deg)}}
.cl{position:absolute;left:-360px;top:90px;width:190px;height:54px;border-radius:60px;background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(255,255,255,.93),rgba(255,255,255,.8));animation:drift 110s linear infinite;transition:opacity 2.5s;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.cl::before,.cl::after{content:'';position:absolute;background:inherit;border-radius:50%;box-shadow:inset 0 -6px 14px rgba(0,0,0,.07)}
.cl::before{width:78px;height:78px;left:24px;top:-40px}.cl::after{width:62px;height:62px;left:100px;top:-27px}
.c2{top:170px;scale:.85;animation-duration:145s;animation-delay:-60s}
.c3{top:50px;scale:.7;animation-duration:125s;animation-delay:-85s}
.c4{top:250px;scale:.6;animation-duration:155s;animation-delay:-100s}
.c5{top:310px;scale:.5;animation-duration:175s;animation-delay:-115s}
.c6{top:360px;scale:.4;animation-duration:195s;animation-delay:-130s}
.night .cl{opacity:.1}
@keyframes drift{to{transform:translateX(calc(100vw + 720px))}}
.hills{position:absolute;left:0;right:0;bottom:0;height:50%;z-index:2;transition:filter 2.5s}
.hills i{position:absolute;border-radius:50%;box-shadow:0 14px 40px rgba(0,0,0,.14)}
.h1{left:-26%;width:95%;height:115%;bottom:-40%;background:linear-gradient(180deg,#cdb9f2,#b3d9c3,#8cd08a,#6bc078,#5ca068)}
.h2{right:-32%;width:110%;height:100%;bottom:-48%;background:linear-gradient(180deg,#b8e7b1,#93d49b,#7cc78c,#6bc078,#5ca068)}
.h3{left:-20%;right:-20%;height:86%;bottom:-50%;background:linear-gradient(180deg,#a8e19c,#7cc78c,#6bc078,#5ca068,#4ca058)}
.h4{left:22%;width:48%;height:38%;bottom:-54%;background:linear-gradient(180deg,#93d49b,#7cc78c,#6bc078);opacity:.68}
.h5{left:52%;width:38%;height:30%;bottom:-57%;background:linear-gradient(180deg,#7cc78c,#6bc078,#5ca068);opacity:.52}
.h6{left:10%;width:30%;height:24%;bottom:-58%;background:linear-gradient(180deg,#a8e19c,#7cc78c);opacity:.45}
.night .hills{filter:brightness(.3) saturate(.6)}
.dusk .hills{filter:brightness(.75) sepia(.3) saturate(1.3)}
.rainbow{position:absolute;left:0;right:0;bottom:18%;height:280px;opacity:0;transition:opacity 2.5s;pointer-events:none;z-index:1}
.rainbow.show{opacity:.5}
.rainbow::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(255,182,193,.38),rgba(255,218,185,.38),rgba(255,255,224,.38),rgba(144,238,144,.38),rgba(135,206,235,.38),rgba(147,112,219,.38),rgba(183,155,255,.38),rgba(200,180,255,.38),transparent);border-radius:50% 50% 0 0/100% 100% 0 0}
header{position:absolute;top:0;left:0;right:0;z-index:7;padding:28px 20px 0;text-align:center}
h1{margin:0 0 16px;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(40px,9vw,60px);letter-spacing:.12em;color:#fff;text-shadow:0 5px 0 #f58aa8,0 6px 0 #e9739a,0 7px 0 #d66c8a,0 16px 35px rgba(120,60,110,.58),0 0 60px rgba(245,138,168,.38),0 0 100px rgba(245,138,168,.22);animation:titleGlow 5s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 5px 0 #f58aa8,0 6px 0 #e9739a,0 7px 0 #d66c8a,0 16px 35px rgba(120,60,110,.58),0 0 60px rgba(245,138,168,.38),0 0 100px rgba(245,138,168,.22)}50%{text-shadow:0 5px 0 #f58aa8,0 6px 0 #e9739a,0 7px 0 #d66c8a,0 16px 35px rgba(120,60,110,.58),0 0 80px rgba(245,138,168).5,0 0 120px rgba(245,138,168,.35)}}
.ctl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{border:2px solid rgba(255,255,255,.94);background:rgba(255,255,255,.68);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:999px;padding:12px 20px;font:inherit;font-size:17px;color:var(--ink);cursor:pointer;box-shadow:0 6px 16px rgba(80,60,100,.18),0 4px 10px rgba(80,60,100,.12);transition:all .4s}
.chip:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(80,60,100,.25),0 5px 12px rgba(80,60,100,.16)}
.chip[aria-pressed=true]{background:linear-gradient(135deg,#ff9db9,#f58aa8,#e9739a);color:#fff;border-color:transparent;box-shadow:0 6px 24px rgba(245,138,168).5,0 0 40px rgba(245,138,168,.3)}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none}
#row{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;align-items:flex-end;gap:clamp(12px,6vw,70px);z-index:3;padding:0 30px}
.ch{position:relative;isolation:isolate;width:clamp(130px,34vw,220px);background:none;border:0;padding:0 0 12px;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .4s}
.ch:hover{transform:translateY(-10px)}
.ch::before{content:'';position:absolute;z-index:-1;left:4%;right:4%;bottom:36px;height:22px;border-radius:50%;background:rgba(30,60,40,.4);filter:blur(12px);transition:all .4s}
.ch:hover::before{height:30px;filter:blur(16px)}
.ch::after{content:'';position:absolute;z-index:-1;left:-18%;right:-18%;top:-12%;bottom:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),transparent);opacity:0;transition:opacity .5s}
.ch.sel::after{opacity:1}
.ch.sel::before{background:rgba(245,138,168).5;filter:blur(20px)}
.face{display:block;animation:bob 4.5s ease-in-out infinite}
.ch:nth-child(2) .face{animation-delay:-1.5s}.ch:nth-child(3) .face{animation-delay:-3s}.ch:nth-child(4) .face{animation-delay:-4.5s}.ch:nth-child(5) .face{animation-delay:-6s}.ch:nth-child(6) .face{animation-delay:-7.5s}.ch:nth-child(7) .face{animation-delay:-9s}.ch:nth-child(8) .face{animation-delay:-10.5s}.ch:nth-child(9) .face{animation-delay:-12s}.ch:nth-child(10) .face{animation-delay:-13.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ch.hop .face{animation:hop .6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-6deg) scale(1.12)}}
.pic{position:relative;display:block}
.pic img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 12px 12px rgba(60,40,70,.3)) drop-shadow(0 24px 30px rgba(60,40,70,.2)) drop-shadow(0 36px 48px rgba(60,40,70,.12));transform-origin:50% 92%;transition:filter .4s}
.ch:hover .pic img{filter:drop-shadow(0 18px 18px rgba(60,40,70,.35)) drop-shadow(0 30px 36px rgba(60,40,70,.25)) drop-shadow(0 42px 54px rgba(60,40,70,.18))}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.st-eat img{animation:chew .4s 4}.st-sleep img{animation:breathe 3.2s ease-in-out infinite}
@keyframes chew{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.86)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.92)}}
.nm{display:block;margin:6px auto 0;width:max-content;font-family:'Jua',sans-serif;font-size:17px;color:#fff;text-shadow:0 4px 8px rgba(60,40,70,.7),0 0 18px rgba(0,0,0,.28);border-radius:999px;padding:6px 20px;transition:all .4s}
.ch.sel .nm{background:linear-gradient(135deg,#ff9db9,#f58aa8,#e9739a);box-shadow:0 6px 22px rgba(245,138,168).7,0 0 35px rgba(245,138,168).4;text-shadow:none;padding:8px 24px}
.bub{position:absolute;bottom:100%;left:50%;width:max-content;max-width:min(260px,56vw);padding:16px 26px;border-radius:28px;background:linear-gradient(135deg,#fff,#fff5f8,#ffeef4,#ffe8f0);font-size:17px;line-height:1.7;box-shadow:0 14px 38px rgba(80,50,90,.3),0 8px 20px rgba(80,50,90,.2);opacity:0;transform:translate(-50%,12px) scale(.7);transition:.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;z-index:6;border:2px solid rgba(255,255,255,.94)}
.bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-12px;border:12px solid transparent;border-top-color:#fff}
.bub.on{opacity:1;transform:translate(-50%,0) scale(1)}
.zz{position:absolute;top:6%;right:14%;font-size:38px;animation:bob 2.2s infinite;text-shadow:0 0 14px rgba(255,255,255,.7)}
.fl{position:absolute;bottom:48%;font-size:34px;pointer-events:none;animation:rise 1.8s forwards;z-index:7;text-shadow:0 0 18px rgba(255,255,255,.7)}
@keyframes rise{0%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(-130px) scale(1.5);opacity:0}}
#panel{position:relative;z-index:6;margin:-45px auto 24px;width:min(680px,calc(100% - 36px));padding:24px 28px 28px;border-radius:40px;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.72));-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);border:2px solid rgba(255,255,255,.97);box-shadow:0 20px 64px rgba(70,50,100,.32),0 12px 36px rgba(70,50,100,.2),inset 0 3px 0 rgba(255,255,255,.92)}
.top{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.lvb{flex:none;position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff9db9,#b79bff,#7ec8ff,#ffd54a,#ff6b9d,#7ec8ff,#ff9db9);box-shadow:0 10px 24px rgba(150,110,200).5,0 0 50px rgba(183,155,255).4;animation:levelGlow 5s ease-in-out infinite}
@keyframes levelGlow{0%,100%{box-shadow:0 10px 24px rgba(150,110,200).5,0 0 50px rgba(183,155,255).4}50%{box-shadow:0 10px 24px rgba(150,110,200).5,0 0 70px rgba(183,155,255).6}}
.lvb::before{content:'';position:absolute;inset:7px;border-radius:50%;background:linear-gradient(135deg,#f58aa8,#a98bf0,#7ec8ff)}
.lvb span{position:relative;font-family:'Jua',sans-serif;font-size:21px;color:#fff;text-shadow:0 3px 6px rgba(0,0,0,.28)}
.top b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:28px;color:var(--ink)}
.top small{color:#8f7f99;font-size:16px}
.st{display:grid;grid-template-columns:84px 1fr 46px;gap:14px;align-items:center;font-size:16px;margin:12px 0}
.tr{height:17px;border-radius:15px;background:rgba(120,90,140,.16);overflow:hidden;box-shadow:inset 0 4px 8px rgba(80,50,100).22}
.tr i{display:block;height:100%;border-radius:15px;transition:width .8s cubic-bezier(0.34,1.56,0.64,1);box-shadow:inset 0 5px 0 rgba(255,255,255).6,0 4px 12px rgba(0,0,0).14}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px}
.a{border:0;border-radius:24px;padding:15px 5px 14px;background:linear-gradient(180deg,#fff,#fff1f6);box-shadow:0 6px 0 #ecd0dc,0 12px 24px rgba(150,100,140).18);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.a::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255).9,transparent);opacity:0;transition:opacity .4s}
.a:hover::before{opacity:1}
.a b{display:block;font-size:36px;font-weight:400;line-height:1.2;position:relative;z-index:1}
.a:hover{transform:translateY(-5px);box-shadow:0 8px 0 #ecd0dc,0 16px 28px rgba(150,100,140).22)}.a:active{transform:translateY(3px);box-shadow:0 4px 0 #ecd0dc,0 8px 16px rgba(150,100,140).14)}
:focus-visible{outline:3px solid #6a8cff;outline-offset:5px}
@media(max-width:640px){.acts{grid-template-columns:repeat(3,1fr)}#scene{min-height:600px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.coin{margin-left:auto;font-family:'Jua',sans-serif;font-size:23px;background:linear-gradient(135deg,#fff3c4,#ffd86b,#ffc950,#e09020);border-radius:999px;padding:10px 20px;box-shadow:0 5px 0 #e0b030,0 10px 24px rgba(224,176,48).3);white-space:nowrap;position:relative;overflow:hidden}
.coin::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255).6,transparent);transform:rotate(45deg);animation:coinShine 4s ease-in-out infinite}
@keyframes coinShine{0%,100%{transform:translateX(-100%) rotate(45deg)}50%{transform:translateX(100%) rotate(45deg)}}
.acts.q{grid-template-columns:repeat(3,1fr);margin-top:14px}
.acts.q .a{background:linear-gradient(180deg,#fff,#eef6ff);box-shadow:0 6px 0 #c9dcf0,0 12px 24px rgba(100,130,160).18)}
.pic svg{overflow:visible}.pic svg.bk{z-index:-1}
.extra-menu{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.extra-btn{border:2px solid rgba(255,255,255).92);background:rgba(255,255,255).65);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;padding:10px 18px;font-family:'Jua',sans-serif;font-size:15px;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px rgba(80,60,100).14);transition:all .35s}
.extra-btn:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(80,60,100).2)}
#qm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(60,40,80).6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#qm[hidden]{display:none}
.qb{width:min(600px,100%);max-height:92dvh;overflow:auto;background:linear-gradient(135deg,rgba(255,255,255).98),rgba(255,255,255).95));border-radius:38px;padding:28px;box-shadow:0 32px 96px rgba(40,20,70).5),0 16px 48px rgba(40,20,70).3)}
.qh{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.qh b{flex:1;font-family:'Jua',sans-serif;font-weight:400;font-size:26px;color:var(--ink)}
#qs{font-family:'Jua',sans-serif;font-size:18px;color:#8f7f99}
#qx{border:0;background:linear-gradient(135deg,#f3e6ec,#ffe3ec);border-radius:50%;width:46px;height:46px;font-size:21px;cursor:pointer;color:var(--ink);box-shadow:0 6px 16px rgba(80,60,100).2);transition:all .4s}
#qx:hover{transform:scale(1.15);box-shadow:0 8px 24px rgba(80,60,100).28)}
.board{display:grid;gap:14px;grid-template-columns:repeat(var(--cols),1fr);touch-action:manipulation}
.cell{aspect-ratio:1;border:0;border-radius:24px;font-size:clamp(32px,12vw,50px);line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:all .2s;-webkit-user-select:none;user-select:none;box-shadow:0 6px 16px rgba(0,0,0).14)}
.cell:hover{transform:scale(1.08)}
.cell:active{transform:scale(.82)}
.cell small{display:block;font-size:14px;color:#c23a52;min-height:18px}
.board.weed .cell{background:radial-gradient(circle at 30% 30%,#b9ea9e,#8cd08a,#6bc078,#5ca068);box-shadow:0 6px 16px rgba(76,144,76).24)}
.board.hunt .cell{background:radial-gradient(circle at 30% 30%,#9a7658,#6b4f3a,#4a3528,#3a2a18);box-shadow:0 6px 16px rgba(75,79,59).24)}
.board.fishing .cell{background:radial-gradient(circle at 30% 30%,#7ec8ff,#5eb4f5,#4a9ce8,#3a88d8);box-shadow:0 6px 16px rgba(78,180,255).24)}
.board.cooking .cell{background:radial-gradient(circle at 30% 30%,#ffd54a,#ffc950,#ffaa30,#e09020);box-shadow:0 6px 16px rgba(255,213,74).24)}
.board.puzzle .cell{background:radial-gradient(circle at 30% 30%,#b79bff,#9a78f0,#7a50d0,#6a30b0);box-shadow:0 6px 16px rgba(119,121,255).24)}
.board.music .cell{background:radial-gradient(circle at 30% 30%,#ff6b9d,#e8507a,#c83058,#a81038);box-shadow:0 6px 16px rgba(255,107,157).24)}
.res{text-align:center;margin-top:20px}
.res p{margin:12px 0 20px;line-height:1.8;font-size:17px}
.res .chip{background:linear-gradient(135deg,#ff9db9,#f58aa8,#e9739a);color:#fff;border-color:transparent;font-size:19px;padding:14px 38px;box-shadow:0 6px 24px rgba(245,138,168).5)}
.tabs{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.pv{width:170px;margin:0 auto 14px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.co{border:2px solid transparent;border-radius:22px;background:linear-gradient(180deg,#fff,#fff1f6);box-shadow:0 6px 0 #ecd0dc,0 12px 24px rgba(150,100,140).18);padding:14px 5px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:all .3s}
.co:hover{transform:translateY(-4px)}
.co b{display:block;font-size:32px;font-weight:400}
.co small{display:block;color:#9a8aa3;margin-top:5px;font-size:14px}

function showAchievement(id){
  if(achievements.includes(id))return;
  achievements.push(id);
  const a=ACHIEVEMENTS[id];
  const el=$('achievement');
  el.textContent=`🏆 ${a.n}`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),5000);
  save();
}

function updateStat(key,val=1){
  stats[key]=(stats[key]||0)+val;
  if(key==='playTime'&&stats.playTime>=3600&&!achievements.includes('play_time_1h'))showAchievement('play_time_1h');
  if(key==='playTime'&&stats.playTime>=36000&&!achievements.includes('play_time_10h'))showAchievement('play_time_10h');
  if(key==='playTime'&&stats.playTime>=360000&&!achievements.includes('play_time_100h'))showAchievement('play_time_100h');
  const h=new Date().getHours();
  if(h>=6&&h<9&&!achievements.includes('early_bird'))showAchievement('early_bird');
  if(h>=21&&h<24&&!achievements.includes('night_owl'))showAchievement('night_owl');
  save();
}

function startEvent(title,durationHours,rewards){

  $('eventContent').innerHTML=`<p>${title} 이벤트가 진행 중입니다!</p><p>특별 보상을 획득하세요!</p>`;

  $('eventModal').hidden=false;

  save();

function closeEventModal(){
  $('eventModal').hidden=true;
}
function updateEventTimer(){
  if(!eventActive||!eventEndTime)return;
  const remaining=eventEndTime-Date.now();
  if(remaining<=0){
    eventActive=false;
    eventEndTime=null;
    $('holidayBanner').classList.remove('show');
    closeEventModal();
    showNotification('이벤트가 종료되었습니다!');
    save();
    return;
  }
  const hours=Math.floor(remaining/3600000);
  const minutes=Math.floor((remaining%3600000)/60000);
  const seconds=Math.floor((remaining%60000)/1000);
  $('eventTimer').textContent=`${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}
setInterval(updateEventTimer,1000);

function pullGacha(){
  if(coins<50){showNotification('코인이 부족해요!');return}
  coins-=50;
  const machine=$('gachaMachine');
  machine.classList.add('spinning');
  setTimeout(()=>{
    machine.classList.remove('spinning');
    const rarities=['common','common','common','uncommon','uncommon','rare','rare','legendary'];
    const weights=[40,30,20,8,1.5,0.4,0.1];
    const items=[
      {i:'🌟',n:'별',r:'common'},
      {i:'⭐',n:'반짝이는 별',r:'uncommon'},
      {i:'💎',n:'크리스탈',r:'rare'},
      {i:'👑',n:'왕관',r:'legendary'},
      {i:'🎀',n:'리본',r:'common'},
      {i:'🌸',n:'꽃',r:'uncommon'},
      {i:'🔮',n:'마법구',r:'rare'},
      {i:'🪄',n:'마법 지팡이',r:'legendary'}
    ];
    const rand=Math.random()*100;
    let rarity='common';
    if(rand<0.1)rarity='legendary';
    else if(rand<0.5)rarity='rare';
    else if(rand<8)rarity='uncommon';
    const filteredItems=items.filter(i=>i.r===rarity);
    const item=filteredItems[Math.floor(Math.random()*filteredItems.length)];
    $('gachaResult').innerHTML=`
      <div class="gacha-item">${item.i}</div>
      <div class="gacha-name">${item.n}</div>
      <div class="gacha-rarity rarity-${item.r}">${item.r.toUpperCase()}</div>
    `;
    gachaHistory.push({item,time:Date.now()});
    if(gachaHistory.length>100)gachaHistory.shift();
    save();
    ui();
  },2000);
}
